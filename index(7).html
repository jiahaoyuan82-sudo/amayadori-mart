}

/** 自然移动: 转向平滑、起步加速、到达减速、拐角提前转弯、互相避让 */
function moveAlong(p, dt) {
  if (p.vx == null) { p.vx = 0; p.vy = 0; p.spd = 0; }
  if (!p.path.length) {
    const k = Math.max(0, 1 - dt * 9);
    p.vx *= k; p.vy *= k; p.spd = Math.hypot(p.vx, p.vy);
    p.moving = p.spd > 0.12;
    if (p.spd > 0.01) { p.x += p.vx * dt; p.y += p.vy * dt; }
    turnToward(p, p.face, dt, 6);
    return true;
  }
  let t = p.path[0], dx = t[0] - p.x, dy = t[1] - p.y, dist = Math.hypot(dx, dy);
  const last = p.path.length === 1;
  if (!last && dist < 0.32) { p.path.shift(); t = p.path[0]; dx = t[0] - p.x; dy = t[1] - p.y; dist = Math.hypot(dx, dy); }
  if (last && dist < 0.03) { p.x = t[0]; p.y = t[1]; p.path.shift(); p.moving = false; return true; }
  const maxS = p.speed * (p.slow || 1);
  const want = last ? Math.min(maxS, dist * 2.8 + 0.18) : maxS;
  let ux = dx / dist, uy = dy / dist;
  if (p.wobble) { const w = Math.sin(G.time * 2.3 + p.phase) * 0.45; const nx = ux - uy * w, ny = uy + ux * w, l = Math.hypot(nx, ny); ux = nx / l; uy = ny / l; }
  const sep = dist > 0.5 ? 1 : 0.2;
  const tx = ux * want + (p.sepX || 0) * sep, ty = uy * want + (p.sepY || 0) * sep;
  const acc = Math.min(1, dt * 7);
  p.vx += (tx - p.vx) * acc; p.vy += (ty - p.vy) * acc;
  // 防止冲过终点
  const step = Math.hypot(p.vx, p.vy) * dt;
  if (last && step >= dist) { p.x = t[0]; p.y = t[1]; p.path.shift(); p.moving = false; return true; }
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.spd = Math.hypot(p.vx, p.vy);
  if (p.spd > 0.05) turnToward(p, [p.vx / p.spd, p.vy / p.spd], dt, 10);
  p.phase += dt * 8.5 * Math.min(1.3, p.spd / 1.25);
  p.moving = p.spd > 0.1;
  return false;
}
function turnToward(p, f, dt, rate) {
  if (!f) return;
  if (!p.dir) p.dir = f.slice();
  const k = Math.min(1, dt * rate);
  let dx = p.dir[0] + (f[0] - p.dir[0]) * k, dy = p.dir[1] + (f[1] - p.dir[1]) * k;
  const l = Math.hypot(dx, dy) || 1;
  p.dir = [dx / l, dy / l];
}
/** 人与人之间的轻微排斥, 避免重叠 */
function computeSeparation(list) {
  for (const p of list) { p.sepX = 0; p.sepY = 0; }
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 > 0.3 || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), f = (0.55 - d) * 1.6 / d;
      a.sepX += dx * f; a.sepY += dy * f; b.sepX -= dx * f; b.sepY -= dy * f;
    }
  }
}
/** 站着时偶尔东张西望 */
function idleLook(p, dt, base) {
  p.lookT = (p.lookT ?? rand(1, 4)) - dt;
  if (p.lookT <= 0) {
    p.lookT = rand(1.5, 4.5);
    const a = Math.atan2(base[1], base[0]) + rand(-0.9, 0.9);
    p.face = Math.random() < 0.6 ? base : [Math.cos(a), Math.sin(a)];
  }
}

function commonPersonUpdate(p, dt) {
  const edge = Math.min(p.x, BOARD.w - p.x);
  p.alpha = clamp(edge / 0.9, 0, 1);
  const wantUmb = G.rain > 0.3 && regionOf(p.x, p.y) !== 'in' && p.y > 7.85 ? 1 : 0;
  p.umbrella = clamp(p.umbrella + clamp(wantUmb - p.umbrella, -dt * 4, dt * 4), 0, 1);
}

function goNext(c) {
  while (c.wants.length && !displayed(c.wants[0])) {     // 想买的东西没摆出来 → 找不到
    G.fin.today.lostStock++; G.fin.today.lostValue += G.price[c.wants[0]]; c.mood -= 0.5; c.wants.shift();
  }
  if (c.wants.length) {
    const spot = pickSpot(c.wants[0]);
    c.path = navPath(c.x, c.y, spot.pos[0], spot.pos[1]);
    c.face = faceFor(spot.fid);
    c.state = 'toShelf';
  } else if (c.thief) {
    leave(c, 0); c.speed = 1.05;
  } else if (c.got.length || c.hot.length) {
    joinQueue(c);
  } else {
    leave(c, -1);
  }
}

function joinQueue(c) {
  G.queue.push(c);
  c.qi = G.queue.length - 1;
  const spot = QUEUE_SPOTS[Math.min(c.qi, QUEUE_SPOTS.length - 1)];
  c.path = navPath(c.x, c.y, spot[0], spot[1]);
  c.face = c.qi < 4 ? [1, 0] : [1, 0.3];
  c.state = 'queue'; c.ready = false;
  const cs = currentCashier();
  let pat = 28 + G.rep * 3;
  if (cs) pat *= 1 + statEff(cs, 'service') * 0.06 + (cs.traits.includes('healing') ? 0.2 : 0);
  c.patience = c.maxPatience = pat;
}

function leave(c, mood) {
  const qi = G.queue.indexOf(c);
  if (qi >= 0) G.queue.splice(qi, 1);
  c.state = 'leaving'; c.ready = false; c.sit = false;
  const lane = LANE_CUSTOMER + rand(-0.12, 0.12);
  c.path = [...navPath(c.x, c.y, DOOR.cx + rand(-0.2, 0.2), ENTRY_IN[1]), [DOOR.cx + rand(-0.15, 0.15), ENTRY_OUT[1]], [DOOR.cx, lane], [c.exitX, lane]];
  c.bubble = mood > 0 ? '♪' : mood < 0 ? '💢' : null;
  c.bubbleT = 3;
  if (mood < 0) Sound.angry();
}

function floatAt(c, text, color) { const [sx, sy] = proj(c.x, c.y, 2.1); addFloat(sx, sy, text, color); }

/** 顾客在货架前拿商品. 返回 'ok' | 'price' | 'empty' */
function takeItem(c, pid) {
  const inv = G.inv[pid];
  if (inv.shelf <= 0) return 'empty';
  if (Math.random() > acceptance(pid)) return 'price';
  inv.shelf--;
  c.got.push({ pid, price: G.price[pid] });
  return 'ok';
}

function tryTake(c, final) {
  const pid = c.wants[0];
  let r = takeItem(c, pid);
  if (r === 'empty') {
    // 同类替代品
    const alt = carriedIn(PRODUCT_BY_ID[pid].cat).filter(p => p.id !== pid && displayed(p.id) && G.inv[p.id].shelf > 0);
    if (alt.length && Math.random() < 0.55) {
      const a = pick(alt);
      if (takeItem(c, a.id) === 'ok') { c.wants.shift(); floatAt(c, `换成${a.emoji}`, '#cde7ff'); goNext(c); return true; }
    }
    if (!final) return false;
    G.fin.today.lostStock++; G.fin.today.lostValue += G.price[pid];
    c.wants.shift(); c.mood--; G.rep = clamp(G.rep - 0.08, 0, 5);
    goNext(c);
    return true;
  }
  if (r === 'price') {
    G.fin.today.lostPrice++; G.fin.today.lostValue += G.price[pid];
    floatAt(c, '太贵了…', '#ffd0a8');
    c.wants.shift(); c.mood -= 0.5;
    goNext(c);
    return true;
  }
  c.wants.shift();
  goNext(c);
  return true;
}

function checkout(c, staff) {
  // 热食: 结账时点单
  for (const pid of c.hot) {
    const r = takeItem(c, pid);
    if (r === 'empty') { G.fin.today.lostStock++; G.fin.today.lostValue += G.price[pid]; c.mood -= 0.5; }
    else if (r === 'price') { G.fin.today.lostPrice++; }
  }
  c.hot = [];
  if (!c.got.length) { leave(c, -1); return; }
  let total = 0;
  for (const g of c.got) { total += g.price; recordSale(g.pid, g.price); }
  total = r1(total);
  G.money = r1(G.money + total); G.served++; G.fin.today.buyers++;
  if (G.stats) G.stats.served++;
  if (typeof earn === 'function') earn(total);
  let repGain = c.mood < 0 ? 0.001 : 0.006;
  if (staff) repGain += statEff(staff, 'service') * 0.0015;
  if (THEME === THEMES.sakura) repGain *= 1.3;
  G.rep = clamp(G.rep + repGain, 0, 5);
  const [sx, sy] = proj(c.x, c.y, 2.0);
  addFloat(sx, sy, `+${yen(total)}`, '#7dffb0');
  Sound.coin();
  if (!staff && navigator.vibrate) navigator.vibrate(20);
  c.bag = true;
  if (typeof onCheckout === 'function') onCheckout(c, staff, total);
  // 买了热食/便当的客人, 有时会去イートイン坐一会儿
  const eat = c.got.some(g => ['hot', 'rice', 'bread'].includes(PRODUCT_BY_ID[g.pid].cat)) && Math.random() < 0.3;
  const seat = eat && EATIN_SEATS.findIndex((s, i) => !G.customers.some(o => o.seat === i));
  if (eat && seat >= 0) {
    const qi = G.queue.indexOf(c); if (qi >= 0) G.queue.splice(qi, 1);
    c.seat = seat; c.state = 'toSeat'; c.ready = false;
    const [sx, sy] = EATIN_SEATS[seat];
    c.path = navPath(c.x, c.y, sx, sy - 0.12).concat([[sx, sy]]); c.face = [0, 1];
    c.bubble = '♪'; c.bubbleT = 2;
    return;
  }
  leave(c, c.mood < 0 ? 0 : 1);
}

function updateCustomer(c, dt) {
  commonPersonUpdate(c, dt);
  if (c.bubbleT > 0) c.bubbleT -= dt;
  const arrived = moveAlong(c, dt);
  if (!c.chimed && c.state === 'walkIn' && c.y < 7.05) { c.chimed = true; Sound.chime(); G.todayCustomers++; }

  switch (c.state) {
    case 'walkIn': if (arrived) goNext(c); break;
    case 'toShelf':
      if (arrived) { c.state = 'pick'; c.timer = c.thief ? rand(5, 7) : rand(0.5, 1.4); c.reach = 0.6; }
      break;
    case 'pick':
      c.timer -= dt; c.reach = c.timer < 0.7 ? 0.8 : 0;
      if (c.timer <= 0 && !tryTake(c, false)) {
        c.state = 'waitStock'; c.timer = 6;
        floatAt(c, '缺货!', '#ff8a7a');
      }
      break;
    case 'waitStock':
      c.timer -= dt;
      if (G.inv[c.wants[0]].shelf > 0) tryTake(c, false);
      else if (c.timer <= 0) tryTake(c, true);
      break;
    case 'queue': {
      const idx = G.queue.indexOf(c);
      if (idx !== c.qi) {
        c.qi = idx;
        const spot = QUEUE_SPOTS[Math.min(idx, QUEUE_SPOTS.length - 1)];
        if (c.path.length) c.path[c.path.length - 1] = spot.slice(); else c.path = [spot.slice()];
      }
      c.ready = idx === 0 && !c.path.length;
      if (!c.path.length) c.patience -= dt * (idx === 0 ? 1 : 0.6);
      if (c.patience <= 0) { G.rep = clamp(G.rep - 0.3, 0, 5); for (const g of c.got) G.inv[g.pid].shelf++; c.got = []; leave(c, -1); }
      break;
    }
    case 'toSeat':
      if (arrived) { c.state = 'eat'; c.sit = true; c.timer = rand(10, 20); }
      break;
    case 'eat':
      c.timer -= dt;
      if (c.timer <= 0) { c.seat = null; leave(c, 1); }
      break;
    case 'leaving':
      if (arrived) c.dead = true;
      break;
  }
  if (!c.moving && !c.path.length) idleLook(c, dt, c.state === 'queue' ? [1, 0] : c.state === 'eat' ? [0, 1] : (c.face || [0, 1]));
}

function updatePasser(p, dt) {
  commonPersonUpdate(p, dt);
  if (p.vendState === 'go' && p.path.length === 2) {          // 到了贩卖机前
    p.vendState = 'buy'; p.timer = rand(1.2, 2.2); p.face = [0, -1]; p.savedPath = p.path; p.path = [];
  }
  if (p.vendState === 'buy') {
    p.timer -= dt; moveAlong(p, dt); p.reach = p.timer > 0.6 ? 0.6 : 0;
    if (p.timer <= 0) { vendSell(p.vendI, p); p.vendState = 'done'; p.path = p.savedPath; p.bag = Math.random() < 0.5; }
    return;
  }
  if (moveAlong(p, dt)) p.dead = true;
}

/* ---------------- 补货 (玩家点击货架) ---------------- */
function playerRestock(cat) {
  const C = CAT_BY_ID[cat];
  const [x, y, z, w, d, h] = C.box;
  const [sx, sy] = proj(x + w / 2, y + d / 2, z + h + 0.6);
  const st = catState(cat);
  const FN = FIX[cat].name;
  if (!st.n) { toast(`「${FN}」上还没摆商品，去「管理货架」安排吧`); return; }
  if (st.shelf >= st.cap) { toast(`「${FN}」已经摆满了`); return; }
  const n = restockCat(cat);
  if (!n) { toast(`📦 仓库里没有「${FN}」上这些商品的货了，去「进货」订货吧`); Sound.angry(); return; }
  addFloat(sx, sy, `⬆ 上架 ${n} 件`, '#9ff0c8');
  Sound.restock();
  if (navigator.vibrate) navigator.vibrate(12);
}

function addFloat(x, y, text, color) { G.floats.push({ x, y, text, color, t: 0 }); }

function toast(msg) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3100);
  while (box.children.length > 3) box.firstChild.remove();
}

/* ---------------- 主更新 ---------------- */
function update(dt) {
  G.time += dt;
  updateCam(dt);
  const adt = G.paused ? 0 : dt * G.speed;

  if (G.started && !G.paused) {
    const dm = adt * MIN_PER_SEC;
    G.minute += dm;
    if (G.minute >= 1440) {
      G.minute -= 1440;
      endDay();
      G.day++; G.todayCustomers = 0;
      startDay();
      save();
    }
    const hr = Math.floor(G.minute / 60);
    if (hr !== G.lastHour) { const prev = G.lastHour; G.lastHour = hr; onHour(prev); }
    G.temp = tempNow();
    // 客流: 泊松到达
    const lambda = G.todayTarget * hourTraffic(G.minute / 60) / HOUR_TRAFFIC_SUM / 60 * dm;
    if (Math.random() < lambda) {
      const inside = G.customers.filter(c => c.state !== 'leaving' && c.state !== 'eat').length;
      if (inside < MAX_INSIDE) spawnCustomer(); else { G.fin.today.crowded = (G.fin.today.crowded || 0) + 1; spawnPasser(); }
    }
    checkDeliveries();
    updateStaff(adt);
    // 没有收银员时, 店长自己慢慢收银 (玩家点击可以马上结账)
    if (!currentCashier()) {
      const c = G.queue[0];
      if (c && c.ready) { G.mgrT = (G.mgrT || 0) + adt; clerk.bubble = '💴'; if (G.mgrT >= 4.2) { G.mgrT = 0; checkout(c); } }
      else { G.mgrT = 0; clerk.bubble = null; }
    } else clerk.bubble = null;
    G.saveT -= dt;
    if (G.saveT <= 0) { G.saveT = 10; save(); }
  }

  G.passT -= adt;
  if (G.passT <= 0) { spawnPasser(); G.passT = rand(3, 7) / (G.started ? hourTraffic(G.minute / 60) : 1); }
  G.carT -= adt;
  if (G.carT <= 0) { spawnCar(); G.carT = rand(4, 10); }

  G.rain = clamp(G.rain + clamp(G.rainTarget - G.rain, -dt * 0.25, dt * 0.25), 0, 1);
  G.cut = clamp(G.cut + clamp(G.cutTarget - G.cut, -dt * 1.5, dt * 1.5), 0, 1);
  Sound.setRain(G.snow ? 0 : G.rain);
  if ((G.time % 2) < dt) Sound.setNight(env.night);

  if (adt > 0) computeSeparation([...G.customers, ...G.passers, ...Object.values(G.staffRT || {})]);
  for (const c of G.customers) updateCustomer(c, adt);
  for (const p of G.passers) updatePasser(p, adt);
  if (typeof updateEvents === 'function') updateEvents(adt, dt);
  for (const car of G.cars) { car.x += car.dir * car.speed * adt; if (car.x < -2 || car.x > BOARD.w + 2) car.dead = true; }
  updateTrucks(adt);
  G.customers = G.customers.filter(c => !c.dead);
  G.passers = G.passers.filter(p => !p.dead);
  G.cars = G.cars.filter(c => !c.dead);

  const near = G.customers.some(c => Math.hypot(c.x - DOOR.cx, c.y - 7.0) < 1.15);
  G.door = clamp(G.door + clamp((near ? 1 : 0) - G.door, -dt * 2.5, dt * 2.5), 0, 1);

  clerk.phase += dt;
  G.floats = G.floats.filter(f => (f.t += dt) < 1.6);
  if (G.flash && (G.flash.t -= dt) <= 0) G.flash = null;
  updateRain(dt);
  computeLight();
  checkAchievements(dt);
}

/* ---------------- 渲染 ---------------- */
function personItem(p) { return { ...personBounds(p), draw: () => drawPerson(p, env) }; }

function render() {
  const c = ctx;
  c.setTransform(ISO.dpr, 0, 0, ISO.dpr, 0, 0);
  const bg = c.createLinearGradient(0, 0, 0, ISO.H);
  bg.addColorStop(0, `rgb(${env.bgTop})`); bg.addColorStop(1, `rgb(${env.bgBot})`);
  c.fillStyle = MANGA.on ? MANGA.tone(lerp(0.97, 0.22, env.night)) : bg; c.fillRect(0, 0, ISO.W, ISO.H);
  drawBackdrop(env);
  drawGround(env);

  const people = [...G.customers, ...G.passers];
  const staffRT = Object.values(G.staffRT || {});
  people.push(...staffRT);
  const showClerk = !G.started || !currentCashier() || !staffRT.some(r => r.state === 'register');
  const back = [...BACK], inside = [...INTERIOR, ...(G.started ? fixtureItems() : fixtureItemsTitle())], front = [...FRONT];
  if (showClerk) inside.push(personItem(clerk));
  for (const p of people) {
    const r = regionOf(p.x, p.y);
    (r === 'in' ? inside : r === 'front' ? front : back).push(personItem(p));
  }
  for (const car of G.cars) {
    front.push({
      x0: car.x - 1.15, x1: car.x + 1.15, y0: car.y - 0.58, y1: car.y + 0.58,
      draw: () => { c.globalAlpha = clamp(Math.min(car.x + 1, BOARD.w + 1 - car.x) / 1.6, 0, 1); drawCar(car.x, car.y, 'x', car.dir, car.color, env, env.night > 0.3); c.globalAlpha = 1; },
    });
  }
  for (const t of G.trucks) {
    front.push({
      x0: t.x - 1.65, x1: t.x + 1.65, y0: t.y - 0.65, y1: t.y + 0.65,
      draw: () => { c.globalAlpha = clamp(Math.min(t.x + 1.5, BOARD.w + 1.5 - t.x) / 1.6, 0, 1); drawTruck(t, env); c.globalAlpha = 1; },
    });
  }

  if (typeof eventItems === 'function') for (const it of eventItems()) (it.region === 'in' ? inside : front).push(it);
  back.sort(depthCmp).forEach(o => o.draw(env));
  drawInnerWalls(env);
  inside.sort(depthCmp).forEach(o => o.draw(env));
  drawShell(env);
  front.sort(depthCmp).forEach(o => o.draw(env));

  drawGlows(env, G.cars);
  drawRain();
  drawVignette();
  drawUI();
}
// 标题画面: 未开始时用默认库存画货架
function fixtureItemsTitle() { return G.inv ? fixtureItems() : []; }

/* ---------------- 画面内 UI (气泡/库存/飘字) ---------------- */
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function bubble(sx, sy, text, bg = '#ffffff', fg = '#222', border = null, scale = 1) {
  const c = ctx, k = (IS_TOUCH ? clamp(ISO.zoom * 1.15, 0.95, 1.4) : clamp(ISO.zoom, 0.75, 1.35)) * scale;
  if (MANGA.on) { bg = '#fff'; fg = '#111'; border = '#111'; }
  c.font = `bold ${Math.round(14 * k)}px ${FONT}`;
  const w = c.measureText(text).width + 16 * k, h = 24 * k;
  const x = sx - w / 2, y = sy - h - 8 * k;
  c.fillStyle = bg; roundRect(c, x, y, w, h, 10 * k); c.fill();
  c.beginPath(); c.moveTo(sx - 5 * k, y + h - 1); c.lineTo(sx, y + h + 7 * k); c.lineTo(sx + 5 * k, y + h - 1); c.fill();
  if (border) { c.strokeStyle = border; c.lineWidth = 2; roundRect(c, x, y, w, h, 10 * k); c.stroke(); }
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, sx, y + h / 2 + 1);
  c.textAlign = 'left';
  return [x, y, w, h];
}

function screenRectOfBox(x, y, z, w, d, h) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [a, b, cc] of [[x, y, z], [x + w, y, z], [x, y + d, z], [x + w, y + d, z], [x, y, z + h], [x + w, y, z + h], [x, y + d, z + h], [x + w, y + d, z + h]]) {
    const p = proj(a, b, cc);
    x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
  }
  return [x0, y0, x1 - x0, y1 - y0];
}

function drawUI() {
  const c = ctx;
  G.hits = [];
  if (G.started) {
    for (const C of CATEGORIES) {
      if (!G.unlocked[C.id]) continue;
      const [x, y, z, w, d, h] = C.box;
      const st = catState(C.id);
      if (!st.n) continue;
      const [sx, sy] = proj(x + w / 2, y + d / 2, z + h + (C.face === 'hot' ? 0.25 : 0.35));
      const hov = (G.hover && G.hover.type === 'fix' && G.hover.cat === C.id) || (G.flash && G.flash.cat === C.id);
      const canUp = catNeedsRestock(C.id, 1);
      const bg = st.empty ? '#e63946' : st.shelf / st.cap < 0.35 ? '#f4a261' : hov ? '#2a9d8f' : 'rgba(20,28,40,0.82)';
      const pct = st.shelf / st.cap;
      const show = hov || st.empty || pct < 0.7;
      const r = show ? bubble(sx, sy, `${C.emoji} ${Math.round(pct * 100)}%${canUp ? ' ⬆' : ''}`, bg, '#fff', hov ? '#fff' : canUp ? '#9ff0c8' : null, 0.92) : [sx - 12, sy - 20, 24, 20];
      G.hits.push({ type: 'fix', cat: C.id, rects: [r, screenRectOfBox(x, y, z, w, d, h)] });
    }
    G.hits.push({ type: 'register', rects: [screenRectOfBox(COUNTER.x0, COUNTER.y0, 0, 0.6, 2.4, 1.5)] });
    VEND_X.forEach((vx, i) => {
      G.hits.push({ type: 'vend', i, rects: [screenRectOfBox(vx, 6.2, 0, 0.85, 0.7, 1.9)] });
      const vm = G.vend[i];
      if (vm.stock <= 5) { const [sx, sy] = proj(vx + 0.42, 6.55, 2.2); bubble(sx, sy, vm.stock ? `🥫 ${vm.stock}` : '🥫 售罄', vm.stock ? '#f4a261' : '#e63946', '#fff', null, 0.8); }
    });
    // 员工气泡
    for (const rt of Object.values(G.staffRT || {})) {
      if (rt.alpha < 0.5) continue;
      const [sx, sy] = proj(rt.x, rt.y, 2.05);
      if (rt.bubble) bubble(sx, sy, rt.bubble, 'rgba(220,245,240,0.92)', '#1b4332', null, 0.8);
    }
    if (clerk.bubble && !currentCashier()) { const [sx, sy] = proj(clerk.x, clerk.y, 2.05); bubble(sx, sy, `💴 ${Math.ceil(Math.max(0, 4.2 - (G.mgrT || 0)))}…`, 'rgba(220,245,240,0.92)', '#1b4332', null, 0.8); }
  }
  const blink = Math.sin(G.time * 8) > 0;
  for (const cu of G.customers) {
    const [sx, sy] = proj(cu.x, cu.y, 2.05);
    const [bx, by] = proj(cu.x, cu.y, 0);
    const k = ISO.zoom;
    G.hits.push({ type: 'customer', c: cu, rects: [[bx - 14 * k, sy + 4 * k, 28 * k, by - sy - 2 * k]] });
    if (cu.alpha < 0.5) continue;
    if ((cu.state === 'toShelf' || cu.state === 'pick') && cu.wants[0]) {
      bubble(sx, sy, PRODUCT_BY_ID[cu.wants[0]].emoji, 'rgba(255,255,255,0.92)');
    } else if (cu.state === 'waitStock' && cu.wants[0]) {
      bubble(sx, sy, `${blink ? '❗' : '❕'}${PRODUCT_BY_ID[cu.wants[0]].emoji}`, '#ffe3e0', '#c1121f', '#e63946');
    } else if (cu.state === 'queue' && cu.ready) {
      const total = r1(cu.got.reduce((s, g) => s + g.price, 0));
      const hotTxt = cu.hot.map(id => PRODUCT_BY_ID[id].emoji).join('');
      const hov = G.hover && (G.hover.type === 'register' || (G.hover.type === 'customer' && G.hover.c === cu));
      const r = bubble(sx, sy, `💴 ${yen(total)}${hotTxt ? ' +' + hotTxt : ''}`, hov ? '#2a9d8f' : '#d8f3dc', hov ? '#fff' : '#1b4332', '#2a9d8f');
      const pr = clamp(cu.patience / cu.maxPatience, 0, 1);
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(r[0], r[1] + r[3] + 9 * k, r[2], 4);
      c.fillStyle = pr > 0.5 ? '#52b788' : pr > 0.25 ? '#f4a261' : '#e63946';
      c.fillRect(r[0], r[1] + r[3] + 9 * k, r[2] * pr, 4);
      G.hits.push({ type: 'customer', c: cu, rects: [r] });
    } else if (cu.state === 'queue' && cu.patience / cu.maxPatience < 0.35 && !cu.path.length) {
      bubble(sx, sy, '😤', 'rgba(255,255,255,0.9)');
    } else if (cu.state === 'leaving' && cu.bubble && cu.bubbleT > 0) {
      bubble(sx, sy, cu.bubble, 'rgba(255,255,255,0.92)', cu.bubble === '♪' ? '#2a9d8f' : '#c1121f');
    }
  }
  if (typeof drawEventUI === 'function') drawEventUI();
  for (const f of G.floats) {
    const k = f.t / 1.6;
    c.globalAlpha = 1 - k * k;
    c.font = `bold ${Math.round(16 * clamp(ISO.zoom, 0.85, 1.3))}px ${FONT}`;
    c.textAlign = 'center';
    c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,0.6)';
    c.strokeText(f.text, f.x, f.y - k * 46);
    c.fillStyle = f.color; c.fillText(f.text, f.x, f.y - k * 46);
    c.textAlign = 'left'; c.globalAlpha = 1;
  }
  if (!IS_TOUCH && G.hover && G.hover.type === 'fix' && pointer.x != null) {
    const C = CAT_BY_ID[G.hover.cat], st = catState(C.id);
    const txt = catNeedsRestock(C.id, 1) ? `「${FIX[C.id].name}」点击上架（仓库 ${st.back} 件）` : st.back ? `「${FIX[C.id].name}」已摆满` : `「${FIX[C.id].name}」仓库没货了，去「进货」订货`;
    c.font = `bold 13px ${FONT}`;
    const w = c.measureText(txt).width + 16;
    c.fillStyle = 'rgba(15,20,30,0.88)'; roundRect(c, pointer.x + 14, pointer.y + 14, w, 26, 8); c.fill();
    c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.fillText(txt, pointer.x + 22, pointer.y + 28); c.textBaseline = 'alphabetic';
  }
}

/* ---------------- 输入 ---------------- */
const pointer = { x: null, y: null };
const pointers = new Map();
let drag = null, pinch = null;

const HIT_PAD = IS_TOUCH ? 12 : 3;
function inRect(x, y, r) { const p = HIT_PAD; return x >= r[0] - p && x <= r[0] + r[2] + p && y >= r[1] - p && y <= r[1] + r[3] + p; }
function hitTest(x, y) {
  if (!G.started) return null;
  for (let i = G.hits.length - 1; i >= 0; i--) {
    const h = G.hits[i];
    if ((h.type === 'event' || (h.type === 'customer' && h.c.thief && !h.c.caught)) && h.rects.some(r => inRect(x, y, r))) return h;
  }
  const ready = G.queue[0] && G.queue[0].ready ? G.queue[0] : null;
  for (let i = G.hits.length - 1; i >= 0; i--) {
    const h = G.hits[i];
    if (h.type === 'customer' && h.c === ready && h.rects.some(r => inRect(x, y, r))) return h;
  }
  for (const h of G.hits) if (h.type === 'fix' && inRect(x, y, h.rects[0])) return h;
  for (const h of G.hits) if (h.type === 'register' && ready && inRect(x, y, h.rects[0])) return h;
  for (const h of G.hits) if (h.type === 'fix' && h.rects[1] && inRect(x, y, h.rects[1])) return h;
  for (const h of G.hits) if (h.type === 'vend' && inRect(x, y, h.rects[0])) return h;
  return null;
}
function onClick(x, y) {
  const h = hitTest(x, y);
  if (!h) return;
  if (h.type === 'event') { h.onClick(); return; }
  if (h.type === 'customer' && h.c.thief) { catchThief(h.c); return; }
  if (h.type === 'vend') { openPanel('order', 'vend'); return; }
  if (h.type === 'fix') { playerRestock(h.cat); G.flash = { cat: h.cat, t: 0.35 }; }
  else if (h.type === 'customer' || h.type === 'register') { if (G.queue[0] && G.queue[0].ready) checkout(G.queue[0]); }
}

canvas.addEventListener('pointerdown', e => {
  if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, px: ISO.panX, py: ISO.panY, moved: false };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: ISO.zoom, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    drag = null;
  }
});
canvas.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoomAt(pinch.cx, pinch.cy, pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    if (drag.moved) { cam.anim = null; ISO.panX = drag.px + dx; ISO.panY = drag.py + dy; }
  }
  G.hover = drag && drag.moved ? null : hitTest(e.clientX, e.clientY);
  canvas.style.cursor = drag && drag.moved ? 'grabbing' : G.hover ? 'pointer' : 'grab';
});
function endPointer(e) {
  if (drag && !drag.moved && pointers.size === 1) onClick(e.clientX, e.clientY);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  drag = null;
  if (e.pointerType !== 'mouse') { pointer.x = null; G.hover = null; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { pointer.x = null; G.hover = null; });

function zoomAt(sx, sy, z) {
  z = clamp(z, fitZoom() * 0.6, fitZoom() * 5);
  const k = z / ISO.zoom;
  ISO.panX = sx - ISO.W / 2 - (sx - ISO.W / 2 - ISO.panX) * k;
  ISO.panY = sy - ISO.H / 2 - (sy - ISO.H / 2 - ISO.panY) * k;
  ISO.zoom = z; cam.anim = null;
}

  } else {
    const r = 12 * k;
    c.beginPath();
    c.moveTo(bx + r, by); c.arcTo(bx + w, by, bx + w, by + h, r); c.arcTo(bx + w, by + h, bx, by + h, r);
    c.lineTo(Math.min(sx + 8 * k, bx + w - r), by + h); c.lineTo(sx, sy - 4 * k); c.lineTo(Math.max(sx - 4 * k, bx + r), by + h);

}

/** 生成今天的新闻并应用效果 (在 startDay 里调用) */
function generateNews() {
  const items = [];
  const used = new Set(), usedTpl = new Set();
  // 2~3 条有影响的 + 1~2 条趣闻 + 1 条天气提示
  const nFx = randInt(2, 3), nFlavor = randInt(1, 2);
  const fxPool = NEWS_TEMPLATES.filter(t => t.kind !== 'flavor');
  let guard = 0;
  while (items.filter(i => i.fx).length < nFx && guard++ < 30) {
    const t = wpick(fxPool.filter(x => !usedTpl.has(x)), x => x.w);
    if (!t) break;
    const n = t.make();
    if (!n || used.has(n.title)) continue;
    used.add(n.title); usedTpl.add(t); items.push(n);
  }
  guard = 0;
  while (items.filter(i => !i.fx).length < nFlavor && guard++ < 30) {
    const n = NEWS_TEMPLATES.find(t => t.kind === 'flavor').make();
    if (used.has(n.title)) continue;
    used.add(n.title); items.push(n);
  }
  // 天气提示 (明天)
  const tm = G.wx[G.day + 1];
  if (tm && tm.f) {
    const W = WEATHER[tm.f.type];
    let tip = '';
    if (tm.f.pop >= 60) tip = '记得多备一点雨伞和毛巾。';
    else if (tm.f.hi >= 26) tip = '冰品和饮料会好卖。';
    else if (tm.f.hi <= 10) tip = '关东煮和肉包会很受欢迎。';
    else tip = '是个适合出门的日子。';
    items.push({ icon: W.icon, tag: '天气', title: `明天${W.name}，最高 ${tm.f.hi}°C，降水 ${tm.f.pop}%`, body: `气象台预报：${tip}${tm.f.event ? `另外明天有「${tm.f.event.name}」。` : ''}` });
  }
  // 头条 = 第一条有影响的新闻
  items.sort((a, b) => (b.fx ? 1 : 0) - (a.fx ? 1 : 0));
  if (G.pendingNews && G.pendingNews.length) { items.unshift(...G.pendingNews); G.pendingNews = []; }
  // 应用效果
  G.trend = {};
  let traffic = 1;
  for (const n of items) {
    const fx = n.fx; if (!fx) continue;
    if (fx.trend) G.trend[fx.trend[0]] = (G.trend[fx.trend[0]] || 1) * fx.trend[1];
    if (fx.trends) for (const [id, m] of fx.trends) G.trend[id] = (G.trend[id] || 1) * m;
    if (fx.cost) for (const p of PRODUCTS_BY_CAT[fx.cost[0]]) G.costMult[p.id] = Math.round(G.costMult[p.id] * fx.cost[1] * 100) / 100;
    if (fx.traffic) traffic *= fx.traffic;
    if (fx.rep) G.rep = clamp(G.rep + fx.rep, 0, 5);
  }
  G.todayTarget *= traffic;
  G.news = { day: G.day, items: items.map(({ icon, tag, title, body, eff }) => ({ icon, tag, title, body, eff })) };
  G.newsArchive = [G.news, ...(G.newsArchive || []).filter(n => n.day !== G.day)].slice(0, 7);
}

function setupTabs(root, first) {
  for (const wrap of root.querySelectorAll('.tabwrap')) {
    const t = wrap.querySelector('.tabs');
    const upd = () => {
      wrap.classList.toggle('can-l', t.scrollLeft > 4);
      wrap.classList.toggle('can-r', t.scrollLeft + t.clientWidth < t.scrollWidth - 4);
    };
    if (P.tabScroll != null && !first) t.scrollLeft = P.tabScroll;

    upd();

    t.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { t.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
    let drag = null;
    t.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') drag = { x: e.clientX, s: t.scrollLeft, moved: false }; });

  }

        </div>
      </div>`;
    }).join('') + '</div>';
  }
  const inc = G.orders.reduce((s, o) => s + o.qty, 0);
  const eta = G.orders.length ? Math.min(...G.orders.map(o => o.eta)) - absMin() : 0;
  const [n, est] = smartOrderEstimate();
  return head('📦 进货') +
    tabs([...CATEGORIES.map(c => [c.id, `${G.unlocked[c.id] ? c.emoji : '🔒'} ${c.name}`]), ['vend', '🥫 贩卖机']]) +
    `<div class="pbody">${body}</div>

       <div class="muted">${inc ? `🚚 在途 ${inc} 件 · 约 ${Math.max(5, Math.round(eta))} 分钟后到` : '下单后约 40～80 分钟送到仓库，再点货架上架'}</div>
       <div class="row">
         <button data-p="smart" ${n ? '' : 'disabled'}>⚡ 一键补单${n ? `（${n} 箱 ${yen(est)}）` : ''}</button>
         <button data-p="shelveall">⬆ 全部上架</button>
       </div>
     </div>`;
}

    <p class="note">💡 利润 = 收入 − 卖掉商品的进价 − 工资 − 解锁/装修等。想多赚：调高热门商品售价、多摆好卖的商品、雇人别让客人等太久。</p>`;
  } else if (P.tab === 'trend') {
    const days = [...G.fin.history.slice(-13), { ...T, customers: G.todayCustomers, partial: true }];
    const max = Math.max(1, ...days.map(d => Math.max(d.sales + (d.vend || 0), d.sales + (d.vend || 0) - dayProfit(d))));
    body = `<div class="chart">${days.map(d => {

        <small>${dateLabel(d.day).replace(/\(.\)/, '')}</small></div>`;
    }).join('')}</div>
    <div class="legend"><span class="s"></span>营业额 <span class="c"></span>支出</div>
    <table class="ftable small"><tr><th>日期</th><th>天气</th><th class="r">客流 预测/实际</th><th class="r">营业额</th><th class="r">利润</th></tr>
    ${days.slice().reverse().map(d => `<tr><td>${dateLabel(d.day)}${d.partial ? ' <small>今天</small>' : ''}</td><td>${WEATHER[d.weather].icon}${d.event ? EVENTS.find(e => e.id === d.event)?.icon || '' : ''}</td>
      <td class="r">${d.fcTraffic || '—'} / <b>${d.customers}</b></td><td class="r">${yen(d.sales)}</td><td class="r ${profit(d) >= 0 ? 'good' : 'bad'}">${yen(profit(d))}</td></tr>`).join('')}</table>`;
  } else {
    const week = {}, rev = {};
    for (const d of [...G.fin.history.slice(-6), T]) for (const [k, v] of Object.entries(d.items)) { week[k] = (week[k] || 0) + v; rev[k] = (rev[k] || 0) + (d.revenueBy[k] || 0); }
    const rows = Object.entries(week).sort((a, b) => rev[b[0]] - rev[a[0]]);
    const max = Math.max(1, ...rows.map(r => rev[r[0]]));
    body = rows.length ? `<p class="muted">最近 7 天（含今天）的商品销售排行</p><div class="rank">${rows.map(([id, n], i) => {

    }).join('')}</div>` : '<div class="empty">还没有卖出东西</div>';
  }
  return head('📊 财报') + tabs([['today', '今日'], ['trend', '近两周'], ['rank', '商品排行']]) + `<div class="pbody">${body}</div>`;
}

/* ======================= 天气 ======================= */
function weatherHTML() {
  const rows = [];
  for (let d = G.day; d <= G.day + 14; d++) {
    const w = G.wx[d]; if (!w || !w.f) continue;
    const f = w.f, W = WEATHER[f.type], dt = dateOf(d), wd = dt.getDay();
    const lab = d === G.day ? '今天' : d === G.day + 1 ? '明天' : d === G.day + 2 ? '后天' : '';
    const range = Math.round(f.traffic * (0.08 + (d - G.day) * 0.015) / 5) * 5;
    rows.push(`<div class="wrow ${d === G.day ? 'today' : ''} ${wd === 0 || wd === 6 ? 'we' : ''}">
      <div class="wd"><b>${dt.getMonth() + 1}/${dt.getDate()}</b><small>周${WEEKDAYS[wd]}</small>${lab ? `<em>${lab}</em>` : ''}</div>
      <div class="wi"><span>${W.icon}</span><small>${W.name}</small></div>
      <div class="wt"><b>${f.hi}°</b><span>${f.lo}°</span></div>
      <div class="wp">💧${f.pop}%</div>
      <div class="wc">👥 约 <b>${f.traffic}</b> 人<small>±${Math.max(5, range)}</small>${f.mood > 1 ? '<em class="busy">热闹</em>' : f.mood < 1 ? '<em class="quiet">冷清</em>' : ''}${d === G.day ? `<i>已来 ${G.todayCustomers} 人</i>` : ''}</div>
      ${f.event ? `<div class="wev">${f.event.icon} ${f.event.name}<small>${f.event.desc}</small></div>` : ''}
    </div>`);
  }
  const t = todayWx();
  return head('🌤 天气预报') + `<div class="wnow"><span class="big">${G.snow && G.rain > 0.1 ? '❄️' : G.rain > 0.1 ? '🌧️' : WEATHER[t.type].icon}</span>
    <div><b>${Math.round(G.temp ?? t.hi)}°C</b><small>雨宿町 · 现在${G.rain > 0.1 ? (G.snow ? '在下雪' : '在下雨') : '没下雨'}</small></div>
    <p>📈 预测客流 = 天气 × 星期 × 口碑 × 活动。<br>⚠️ 预报越远越不准，每天的实际客流也会有随机波动。</p></div>
    <div class="pbody wlist">${rows.join('')}</div>`;
}

      const ready = interviewReady(), left = INTERVIEW_CD - (G.day - (G.lastInterview || 0));
      body = `<div class="mediacard"><div class="big">📺</div><h3>地方电视台「街角美食」专访</h3>
        <p>接受采访后：今天和接下来两天客流 <b>+20%</b>，口碑 <b>+0.25</b>，明天的《雨宿日报》会刊登专访头条。</p>
        <button class="primary" data-p="interview" ${ready ? '' : 'disabled'}>${ready ? '🎤 接受采访' : `冷却中，还要 ${left} 天`}</button>
        <small>每 ${INTERVIEW_CD} 天可以接受一次 · 已接受 ${G.stats.interviews || 0} 次</small></div>
        <div class="mediacard ${G.neon ? '' : 'dim'}"><div class="big">👑</div><h3>金色霓虹招牌</h3><p>${G.neon ? '已点亮！招牌变成金色，晚上闪闪发光，客流永久 +5%。' : '店铺达到 Lv5「传说便利店」后自动点亮，客流永久 +5%。'}</p></div>`;
    }
  } else {
    body = `<div class="badgegrid">${BADGES.map(b => { const got = G.badges.includes(b.id), v = Math.min(b.val(), b.goal); return `<div class="badge ${got ? 'got' : ''}"><div class="medal">${b.icon}</div><b>${b.name}</b><small>${b.desc}</small>${got ? `<span class="bdone">✅ 已获得 · 奖励 ${yen(b.reward)}</span>` : `${bar(v, b.goal, 'gold')}<span class="bprog">${typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(1) : v} / ${b.goal} · 奖励 ${yen(b.reward)}</span>`}</div>`; }).join('')}</div>`;
  }
  return head('🏆 成就') + tabs(T) + `<div class="pbody">${body}</div>`;
}

/* ======================= 管理货架 ======================= */
function shelfHTML() {
  const tabsList = [['overview', '📋 总览'], ...FIX_ORDER.map(f => [f, `${fixOpen(f) ? CAT_BY_ID[f].emoji : '🔒'} ${FIX[f].name}`])];
  if (P.tab !== 'overview' && !FIX[P.tab]) P.tab = 'overview';
  const body = P.tab === 'overview' ? shelfOverview() : shelfDetail(P.tab);
  return head('🗂 管理货架') + tabs(tabsList) + body;
}
function fixFill(fid) { const s = catState(fid); return s.cap ? s.shelf / s.cap : 0; }
function shelfOverview() {
  const und = PRODUCTS.filter(p => G.carried[p.id] && G.unlocked[p.cat] && !displayed(p.id));
  const cards = FIX_ORDER.map(fid => {
    const F = FIX[fid], open = fixOpen(fid), ps = open ? displayedOn(fid) : [], s = catState(fid);
    const used = open ? G.plan[fid].filter(Boolean).length : 0, tot = fixSlots(fid);
    return `<button class="fxcard ${open ? '' : 'locked'} st-${F.style}" data-p="tab:${fid}">
      <div class="fx-h"><b>${open ? CAT_BY_ID[fid].emoji : '🔒'} ${F.name}</b><small>${F.sub}</small></div>
      <div class="fx-mini" style="grid-template-columns:repeat(${F.cols},1fr)">${open ? rowsTopDown(fid).map(i => `<span>${G.plan[fid][i] ? PRODUCT_BY_ID[G.plan[fid][i]].emoji : ''}</span>`).join('') : ''}</div>
      <div class="fx-f">${open ? `<span>格子 ${used}/${tot}</span><span>库存 ${Math.round(fixFill(fid) * 100)}%</span>${s.empty ? '<em class="bad">有空货</em>' : ''}` : '<span>在「进货」里解锁</span>'}</div>
    </button>`;
  }).join('');
  return `<div class="pbody">
    ${und.length ? `<div class="warnbox"><div><b>⚠️ 这些商品进了货，但没摆出来，客人买不到：</b><div class="chips">${und.map(p => `<span class="chip">${p.emoji} ${esc(p.cn)}</span>`).join('')}</div></div><button class="primary" data-p="placeall">一键摆上</button></div>` : ''}
    <div class="fxgrid">${cards}</div>
    <div class="tipbox"><b>📐 陈列小知识</b>
      <span>🧺 每 1 格能放 ${PER_FACE} 件商品，格子越多越不容易卖空</span>
      <span>👀 格子越多越显眼：1 格人气 ×0.9 → 4 格 ×1.5</span>
      <span>⭐ 中间「黄金层」在视线高度，人气再 +15%；只放在最下层 -10%</span>
      <span>🛒 收银台旁的 C 货架容易冲动消费 +8%</span>
      <span>🚫 没有摆出来的商品，客人找不到也买不到</span></div>
  </div>`;
}
function rowsTopDown(fid) { const F = FIX[fid], out = []; for (let t = F.tiers - 1; t >= 0; t--) for (let c = 0; c < F.cols; c++) out.push(t * F.cols + c); return out; }
function shelfDetail(fid) {
  const F = FIX[fid], C = CAT_BY_ID[fid];
  if (!fixOpen(fid)) return `<div class="pbody"><div class="lockcard"><div class="big">🔒</div><h3>${F.name}</h3><p>先在「进货」里解锁「${C.name}」才能使用这个货架。</p><button class="primary" data-p="noop" onclick="openPanel('order','${fid}')">去解锁</button></div></div>`;
  const plan = G.plan[fid], seen = {};
  const cellHTML = i => {
    const pid = plan[i], sel = P.sel === i;
    if (!pid) return `<button class="cell empty ${sel ? 'sel' : ''}" data-p="slot:${fid}:${i}"><span class="plus">＋</span><small>空位</small></button>`;
    const p = PRODUCT_BY_ID[pid], k = seen[pid] = (seen[pid] || 0) + 1;
    const fill = clamp((G.inv[pid].shelf - (k - 1) * PER_FACE) / PER_FACE, 0, 1);
    const hotT = G.trend && G.trend[pid] > 1;
    return `<button class="cell ${sel ? 'sel' : ''} ${fill <= 0 ? 'out' : ''}" data-p="slot:${fid}:${i}" style="--pc:${p.look[1]}">
      ${hotT ? '<i class="hot">🔥</i>' : ''}<span class="pe2">${p.emoji}</span><small>${esc(p.cn)}</small>
      <span class="fillbar"><span style="width:${fill * 100}%"></span></span><span class="ptag">${yen(G.price[pid])}</span></button>`;
  };
  // 格子编号自下而上 (0 = 最下层), 显示时从上往下排
  const rows = Array.from({ length: F.tiers }, (_, k) => F.tiers - 1 - k);
  const cellsByIdx = {}; for (let i = 0; i < plan.length; i++) cellsByIdx[i] = cellHTML(i);
  const viz = `<div class="shelfviz sv-${F.style}">${rows.map(t => `<div class="srow ${isGolden(fid, t) ? 'gold' : ''}"><div class="slabel">${tierLabel(fid, t)}${isGolden(fid, t) ? '<b>⭐ 人气+15%</b>' : ''}</div><div class="scells" style="grid-template-columns:repeat(${F.cols},minmax(0,1fr))">${Array.from({ length: F.cols }, (_, c) => cellsByIdx[t * F.cols + c]).join('')}</div></div>`).join('<div class="plank"></div>')}</div>`;
  let picker = '';
  if (P.sel != null && P.sel < plan.length) {
    const t = Math.floor(P.sel / F.cols), c = P.sel % F.cols;
    const opts = PRODUCTS.filter(p => F.accepts.includes(p.cat) && G.unlocked[p.cat]);
    opts.sort((a, b) => (G.carried[b.id] ? 1 : 0) - (G.carried[a.id] ? 1 : 0) || (b.cat === fid) - (a.cat === fid));
    picker = `<div class="picker"><div class="pk-h"><b>✏️ ${tierLabel(fid, t)} · 第 ${c + 1} 格 放什么？</b>
      <span><button class="sm" data-p="col:${fid}:${P.sel}" ${plan[P.sel] ? '' : 'disabled'}>整列都放这个</button> <button class="sm" data-p="put:${fid}:${P.sel}:">清空这一格</button> <button class="sm" data-p="slot:${fid}:${P.sel}">完成</button></span></div>
      <div class="pk-grid">${opts.map(p => `<button class="pk ${plan[P.sel] === p.id ? 'on' : ''} ${G.carried[p.id] ? '' : 'nc'}" data-p="put:${fid}:${P.sel}:${p.id}">
        <span class="pe2">${p.emoji}</span><b>${esc(p.cn)}</b><small>${G.carried[p.id] ? `已摆 ${facings(p.id)} 格 · 仓库 ${G.inv[p.id].back}` : '还没进过货'}</small>${G.trend && G.trend[p.id] > 1 ? '<i class="hot">🔥 今日热门</i>' : ''}</button>`).join('')}</div></div>`;
  }
  const ps = displayedOn(fid);
  const summary = ps.length ? `<table class="ftable small sumtab"><tr><th>商品</th><th class="r">格子</th><th class="r">货架</th><th class="r">人气</th></tr>${ps.map(p => {
    const fl = facingList(p.id), v = visibility(p.id);
    return `<tr><td>${p.emoji} ${esc(p.cn)} ${fl.some(x => isGolden(x.fid, x.t)) ? '⭐' : ''}</td><td class="r">${fl.length}</td><td class="r">${G.inv[p.id].shelf}/${shelfCap(p.id)}</td><td class="r ${v >= 1.2 ? 'good' : v < 1 ? 'bad' : ''}">×${v.toFixed(2)}</td></tr>`;
  }).join('')}</table>` : '<div class="empty">货架是空的，点上面的格子开始摆放吧</div>';
  const s = catState(fid);
  return `<div class="pbody">
    <div class="fxhead"><div><b>${C.emoji} ${F.name}</b><small>${F.sub} · 可放：${F.accepts.filter(a => CAT_BY_ID[a]).map(a => CAT_BY_ID[a].name).join(' / ')}</small></div>
      <div class="fxstat"><span>库存</span><b>${Math.round(fixFill(fid) * 100)}%</b><small>仓库 ${s.back} 件</small></div></div>
    ${viz}${picker}
    <p class="note">👆 点一个格子，再选商品。每格放 ${PER_FACE} 件；同一种商品摆的格子越多，越显眼、越不容易卖空。</p>
    ${summary}
  </div>
  <div class="pfoot"><div class="row">
    <button data-p="auto:${fid}">✨ 按销量自动陈列</button>
    <button data-p="restockfix:${fid}">⬆ 上架</button>
    <button data-p="clearfix:${fid}">🧹 清空</button>
  </div></div>`;
}

/* ======================= 新闻 ======================= */
function newsHTML() {
  const list = G.newsArchive && G.newsArchive.length ? G.newsArchive : (G.news ? [G.news] : []);
  const idx = P.tab === 'today' ? 0 : clamp(+P.tab || 0, 0, list.length - 1);
  const N = list[idx];
  if (idx === 0 && N) G.newsSeen = N.day;
  const d = N ? dateOf(N.day) : new Date();
  const [head0, ...rest] = N ? N.items : [];
  const body = !N ? '<div class="empty">还没有新闻</div>' : `<div class="paper">
    <div class="masthead"><div class="mt-title">雨宿日報 <small>AMAYADORI TIMES</small></div>
      <div class="mt-sub">${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}） · 第 ${N.day} 号 · 每天 0:00 送达</div></div>
    <div class="headline"><div class="hl-icon">${head0.icon}</div><div><span class="ntag">${head0.tag}</span><h3>${esc(head0.title)}</h3><p>${esc(head0.body)}</p>${head0.eff ? `<div class="eff">📌 ${esc(head0.eff)}</div>` : ''}</div></div>
    <div class="ncols">${rest.map(n => `<div class="nitem"><div class="ni-h"><span class="ni-icon">${n.icon}</span><span class="ntag">${n.tag}</span></div><h4>${esc(n.title)}</h4><p>${esc(n.body)}</p>${n.eff ? `<div class="eff">📌 ${esc(n.eff)}</div>` : ''}</div>`).join('')}</div>
  </div>`;
  const tabsList = list.map((n, i) => [i === 0 ? 'today' : String(i), i === 0 ? '今天' : dateLabel(n.day)]);
  if (P.tab !== 'today' && !tabsList.some(t => t[0] === P.tab)) P.tab = 'today';
  return head('📰 新闻') + tabs(tabsList) + `<div class="pbody">${body}<p class="note">新闻每天随机更新。带 📌 的新闻会影响当天的人气、进价或客流，记得根据新闻调整进货！</p></div>`;
}

/* ======================= 事件处理 ======================= */
$('modal-body').addEventListener('click', e => {
  if (!P.active) return;
  const ar = e.target.closest('[data-tscroll]');
  if (ar) { const t = ar.parentElement.querySelector('.tabs'); t.scrollBy({ left: +ar.dataset.tscroll * Math.max(200, t.clientWidth * 0.7), behavior: 'smooth' }); return; }
  if (P.tabDragged && performance.now() - P.tabDragged < 250 && e.target.closest('.tabs')) return;
  const el = e.target.closest('[data-p]');
  if (!el || el.disabled) return;
  const [act, a, b] = el.dataset.p.split(':');
  Sound.click();
  switch (act) {
    case 'close': closeModal(); return;
    case 'tab': P.tab = a; P.sub = null; P.sel = null; renderPanel(false); return;
    case 'slot': P.sel = P.sel === +b ? null : +b; break;
    case 'theme': {
      const t = THEMES[a];
      if (!t || G.theme === a || G.money < t.price) break;
      G.money = r1(G.money - t.price); G.fin.today.other = r1(G.fin.today.other + t.price);
      G.theme = a; applyTheme(a); if (t.price) G.stats.renos++;
      toast(`🎨 装修完成：「${t.name}」！${t.bonusText}`); Sound.fanfare();
      break;
    }
    case 'psel': P.psel = +a; break;
    case 'poster': {
      const i = +a, id = el.dataset.p.split(':')[2] || null;
      if (id) {
        if (G.money < POSTER_COST) break;
        G.money = r1(G.money - POSTER_COST); G.fin.today.other = r1(G.fin.today.other + POSTER_COST);
        const j = G.posters.indexOf(id); if (j >= 0) G.posters[j] = null;
        G.posters[i] = id; toast(`🪧 贴上了「${POSTER_BY_ID[id].cn}」海报：${POSTER_BY_ID[id].desc}`);
        P.psel = (i + 1) % 3;
      } else { G.posters[i] = null; toast('🧽 海报撕掉了'); }
      break;
    }
    case 'interview': doInterview(); break;
    case 'put': {
      const [fid, i, pid] = [a, +b, el.dataset.p.split(':')[3] || null];
      if (setSlot(fid, i, pid)) {
        if (pid && !G.carried[pid]) toast(`📝 ${PRODUCT_BY_ID[pid].emoji}${PRODUCT_BY_ID[pid].name} 还没进货，记得去「进货」订货`);
        if (pid) restockCat(fid);
        // 自动选中下一个空格, 方便连续摆放
        const nx = G.plan[fid].findIndex((x, k) => k > i && !x);
        P.sel = pid && nx >= 0 ? nx : null;
        Sound.restock();
      }
      break;
    }
    case 'col': {
      const fid = a, i = +b, F = FIX[fid], pid = G.plan[fid][i];
      for (let t = 0; t < F.tiers; t++) setSlot(fid, t * F.cols + (i % F.cols), pid);
      if (pid) restockCat(fid);
      break;
    }
    case 'auto': if (autoArrange(a)) { restockCat(a); toast(`✨ 已按最近销量重新陈列「${FIX[a].name}」`); } else toast('这个货架没有可以摆的商品'); P.sel = null; break;
    case 'clearfix': { const ids = displayedOn(a).map(p => p.id); G.plan[a] = G.plan[a].map(() => null); ids.forEach(clampShelf); P.sel = null; toast(`🧹 清空了「${FIX[a].name}」，货都退回仓库了`); break; }
    case 'restockfix': { const n = restockCat(a); toast(n ? `⬆ 上架了 ${n} 件` : '没有可以上架的货'); break; }
    case 'placeall': {
      let n = 0;
      for (const p of PRODUCTS) if (G.carried[p.id] && G.unlocked[p.cat] && !displayed(p.id) && autoPlace(p.id)) { n++; }
      FIX_ORDER.forEach(f => fixOpen(f) && restockCat(f));
      toast(n ? `🗂 摆上了 ${n} 种商品` : '没有空位了，先清出一些格子');
      break;
    }
    case 'place': { const f = autoPlace(a); toast(f ? `🗂 摆到了「${FIX[f].name}」` : '没有空位了，去「管理货架」调整'); if (f) restockCat(f); break; }
    case 'price': {
      const p = PRODUCT_BY_ID[a];
      G.price[a] = clamp(r1(G.price[a] + Number(b)), Math.max(0.5, Math.round(p.price * 0.5 * 2) / 2), Math.round(p.price * 2 * 2) / 2);
      break;
    }
    case 'vprice': { const vm = G.vend[+a], d = VEND_DEFS[+a]; vm.price = clamp(r1(vm.price + Number(b)), 1, d.price * 2); break; }
    case 'vfill': vendRefill(+a); break;
    case 'pricetip': try { localStorage.setItem('amayadori-price-tip', '1'); } catch (e) {} P.priceTip = false; break;
    case 'preset': {
      const k = Number(b);
      PRODUCTS_BY_CAT[a].forEach(p => { G.price[p.id] = Math.max(0.5, Math.round(p.price * k * 2) / 2); });
      toast(`🏷 「${CAT_BY_ID[a].name}」全部改成${k < 1 ? '薄利多销' : k === 1 ? '建议价' : k < 1.1 ? '稍贵' : '高利润'}价格`);
      try { localStorage.setItem('amayadori-price-tip', '1'); } catch (e) {}
      break;
    }
    case 'noop': return;
    case 'order':
      if (placeOrder(a, Number(b))) toast(`📝 已下单 ${PRODUCT_BY_ID[a].emoji} ${PRODUCT_BY_ID[a].name} ×${PRODUCT_BY_ID[a].box}`);
      break;
    case 'smart': { const [n, cost] = smartOrder(); toast(n ? `⚡ 补单 ${n} 箱，共 ${yen(cost)}` : '没有需要补的或钱不够'); break; }
    case 'shelveall': {
      let n = 0;
      for (const c of CATEGORIES) if (G.unlocked[c.id]) n += restockCat(c.id);
      toast(n ? `⬆ 上架了 ${n} 件商品` : '仓库没有可上架的货');
      if (n) Sound.restock();
      break;
    }
    case 'unlock':
      if (unlockCategory(a)) { toast(`🎉 解锁了「${CAT_BY_ID[a].name}」！记得去进货`); Sound.coin(); }
      break;
    case 'shift': { const st = findPerson(+a); st.shift = b; break; }
    case 'role': { const st = findPerson(+a); st.role = b; if (G.staffRT[st.id]) G.staffRT[st.id].role = null; break; }
    case 'resume': P.sub = +a; renderPanel(true); return;
    case 'back': P.sub = null; renderPanel(true); return;
    case 'hire': { const c = findPerson(+a); if (c && hire(c)) { P.sub = null; P.tab = 'crew'; renderPanel(true); return; } break; }
    case 'fire': {
      const st = findPerson(+a);
      P.active = false;
      confirmBox('解雇员工', `确定要解雇 <b>${esc(st.name)}</b> 吗？`, '解雇', () => { fire(st); P.sub = null; openPanel('staff', 'crew'); }, true, () => openPanel('staff'));
      return;
    }
    case 'ad': if (postJobAd()) toast('📢 招聘广告发出去了，来了 4 位新的应聘者'); break;
  }
  renderPanel(false);
});

</script>
