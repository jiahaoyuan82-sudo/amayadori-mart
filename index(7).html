  --red: #e63946;
  --navy: #1f3c88;
  --panel: rgba(14, 20, 32, 0.8);
  --line: rgba(255, 255, 255, 0.12);
  --font: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Microsoft YaHei', sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #05070c; font-family: var(--font); color: #eef2f7;
  overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
canvas#game { display: block; touch-action: none; cursor: grab; position: fixed; inset: 0; }
.hidden { display: none !important; }

button {
  font-family: inherit; font-weight: 700; font-size: 14px; color: #eef2f7;
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px;
  transition: background .15s, transform .1s;
}
button:hover { background: rgba(255, 255, 255, 0.18); }
button:active { transform: scale(0.95); }
button.on { background: var(--teal); border-color: var(--teal); }
button.primary { background: var(--teal); border-color: var(--teal); }
button.primary:hover { background: #33b3a3; }
button.danger { background: var(--red); border-color: var(--red); }
button.link { background: none; border: none; color: #9fb3d1; font-size: 13px; text-decoration: underline; min-height: 32px; }

/* ---------- 标题 ---------- */
#title {
  position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center;
  padding: 0 16px calc(5vh + var(--sab)); pointer-events: none;
  background: linear-gradient(to top, rgba(5, 7, 12, 0.9) 0%, rgba(5, 7, 12, 0) 48%);
}
.title-card { text-align: center; pointer-events: auto; animation: rise .9s ease-out both; width: 100%; max-width: 460px; }
.title-card .logo {
  width: 60px; height: 60px; margin: 0 auto 6px; border-radius: 50%;
  background: var(--navy); display: grid; place-items: center; font-size: 34px;
  box-shadow: 0 0 30px rgba(120, 150, 255, 0.5);
}
.title-card h1 { margin: 0; font-size: clamp(30px, 9vw, 56px); font-weight: 900; letter-spacing: 0.04em; text-shadow: 0 0 24px rgba(255, 240, 210, 0.45); white-space: nowrap; }
.title-card .sub { margin: 4px 0 10px; color: #9fb3d1; letter-spacing: 0.18em; font-size: 12px; }
.title-card .desc { margin: 0 0 18px; color: #cfd8e6; line-height: 1.7; font-size: 14px; }
.title-card .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.title-card .btns button { font-size: 17px; padding: 12px 28px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.title-card .btns button small { font-size: 11px; font-weight: 500; opacity: 0.8; }
.title-card button.primary { box-shadow: 0 6px 24px rgba(42, 157, 143, 0.45); }
.title-card .hint { margin: 10px 0 0; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

/* ---------- HUD ---------- */
.panel {
  position: fixed; top: calc(12px + var(--sat)); padding: 10px 16px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  pointer-events: none;
}
.panel.tl { left: calc(12px + var(--sal)); }
.panel.tr { right: calc(12px + var(--sar)); text-align: right; }
.brand { font-size: 12px; color: #9fb3d1; letter-spacing: 0.08em; }
#clock { font-size: 34px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
#day { font-size: 13px; color: #cfd8e6; }
.money { font-size: 22px; white-space: nowrap; }
.money b { font-size: 26px; color: #ffd27a; font-variant-numeric: tabular-nums; }
.money span { font-size: 13px; color: #9fb3d1; }
#rep { color: #ffd166; font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; }
#today { font-size: 12px; color: #9fb3d1; margin-top: 2px; white-space: nowrap; }

#toolbar {
  position: fixed; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%);
  display: flex; gap: 6px; padding: 7px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#toolbar button { font-size: 13px; padding: 7px 13px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#toolbar button i { font-style: normal; font-size: 15px; }

#help {
  position: fixed; left: calc(14px + var(--sal)); bottom: calc(16px + var(--sab)); font-size: 12px; line-height: 1.7;
  padding: 10px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  color: #cfd8e6; pointer-events: none;
}
#help b { display: block; color: #fff; font-size: 13px; margin-bottom: 2px; }

#toasts {
  position: fixed; top: calc(16px + var(--sat)); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 30;
  width: max-content; max-width: 92vw;
}
.toast {
  padding: 8px 16px; border-radius: 16px; font-size: 14px; font-weight: 700; text-align: center;
  background: rgba(14, 20, 32, 0.92); border: 1px solid var(--line);
  animation: rise .3s ease-out both; transition: opacity .5s, transform .5s;
}
.toast.out { opacity: 0; transform: translateY(-8px); }

/* ---------- 弹窗 ---------- */
#modal {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  background: rgba(3, 5, 10, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade .2s ease-out both;
}
.sheet {
  width: min(440px, 92vw); max-height: 86vh; overflow-y: auto; padding: 20px 20px 18px;
  background: #121a29; border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); animation: rise .25s ease-out both;
  -webkit-user-select: text; user-select: text; touch-action: pan-y;
}
.sheet h2 { margin: 0 0 10px; font-size: 20px; }
.sheet p { margin: 0 0 14px; color: #cfd8e6; font-size: 14px; line-height: 1.7; }
.sheet p.note { font-size: 12px; color: #8b9ab1; margin: 14px 0 0; }
.sheet code { background: rgba(255,255,255,0.1); padding: 1px 6px; border-radius: 6px; }
.sheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.sheet .row button { flex: 1; min-height: 46px; font-size: 15px; }
.sheet .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sheet .grid button { min-height: 48px; border-radius: 14px; font-size: 14px; }
.sheet .grid .wide { grid-column: span 2; }
.sheet textarea {
  width: 100%; height: 96px; resize: none; margin-bottom: 12px; padding: 10px;
  border-radius: 12px; border: 1px solid var(--line); background: #0a0f19; color: #dbe6f5;
  font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; word-break: break-all;
  -webkit-user-select: text; user-select: text;
}
.tut { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 10px; }
.tut li { display: flex; gap: 12px; align-items: flex-start; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 10px 12px; font-size: 13px; color: #cfd8e6; line-height: 1.6; }
.tut li span { font-size: 26px; line-height: 1.2; }
.tut li b { display: block; color: #fff; font-size: 15px; }
.tut em { font-style: normal; font-weight: 700; }
.tut em.o { color: var(--orange); } .tut em.r { color: #ff6b6b; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- 手机竖屏 ---------- */
@media (max-width: 760px) {
  #help { display: none; }
  .panel { padding: 7px 12px; border-radius: 14px; }
  .brand { display: none; }
  #clock { font-size: 24px; }
  #day { font-size: 12px; }
  .money { font-size: 16px; }
  .money b { font-size: 20px; }
  #rep { font-size: 13px; }
  #today { font-size: 11px; }
  #toasts { top: calc(84px + var(--sat)); }
  .toast { font-size: 13px; padding: 7px 14px; }
  #toolbar { gap: 4px; padding: 6px; border-radius: 22px; width: calc(100vw - 20px - var(--sal) - var(--sar)); max-width: 420px; justify-content: space-between; }
  #toolbar button { flex: 1; flex-direction: column; gap: 0; padding: 5px 0 4px; min-height: 52px; border-radius: 16px; font-size: 10px; font-weight: 500; }
  #toolbar button i { font-size: 20px; line-height: 1.2; }
  #modal { align-items: flex-end; }
  .sheet {
    width: 100vw; max-width: 560px; border-radius: 22px 22px 0 0; max-height: 82vh;
    padding: 18px 16px calc(16px + var(--sab)); animation: slideup .28s ease-out both;
  }
  .title-card .desc { font-size: 13px; }
}
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }

/* ---------- 手机横屏 (高度很小) ---------- */
@media (max-height: 500px) and (orientation: landscape) {
  #help { display: none; }
  .panel { padding: 5px 10px; top: calc(8px + var(--sat)); }
  .brand, #today { display: none; }
  #clock { font-size: 20px; }
  .money { font-size: 15px; }
  .money b { font-size: 17px; }
  #toasts { top: calc(10px + var(--sat)); }
  #toolbar { bottom: calc(6px + var(--sab)); padding: 4px; gap: 4px; border-radius: 18px; width: auto; }
  #toolbar button { padding: 3px 12px; min-height: 40px; min-width: 52px; flex: none; flex-direction: column; gap: 0; font-size: 9px; border-radius: 14px; }
  #toolbar button i { font-size: 16px; }
  #title { padding-bottom: calc(10px + var(--sab)); }
  .title-card .logo, .title-card .desc { display: none; }
  .title-card h1 { font-size: 30px; }
  .sheet { max-height: 92vh; }
}

/* =========================================================
 * 管理面板 (进货 / 人员 / 财报 / 天气)
 * ========================================================= */
#toolbar button.alert { box-shadow: 0 0 0 2px #e63946 inset; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { background: rgba(230, 57, 70, 0.35); } }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.sm { min-height: 32px; padding: 5px 12px; font-size: 13px; }

.sheet.big {
  width: min(760px, 96vw); height: min(88vh, 860px); max-height: none; padding: 0;
  display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none;
}
.ph { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.ph h2 { margin: 0; font-size: 20px; flex: 1; }
.pmoney { font-weight: 700; color: #ffd27a; font-variant-numeric: tabular-nums; }
.ph .x { min-height: 36px; width: 36px; padding: 0; border-radius: 50%; font-size: 15px; }
.tabs { display: flex; gap: 6px; padding: 0 18px 10px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { white-space: nowrap; min-height: 34px; padding: 6px 13px; font-size: 13px; }
.pbody { flex: 1; overflow-y: auto; padding: 4px 18px 16px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.pfoot { padding: 10px 18px calc(12px + var(--sab)); border-top: 1px solid var(--line); background: #0f1623; }
.pfoot .row { margin-top: 6px; }
.muted { color: #8b9ab1; font-size: 12px; }
.note { color: #8b9ab1; font-size: 12px; line-height: 1.6; }
.empty { text-align: center; color: #9fb3d1; padding: 40px 10px; line-height: 1.8; }
.good { color: #6ee7a8 !important; } .bad { color: #ff8a8a !important; }
em.good, em.bad, em.new { font-style: normal; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,0.08); }
em.new { color: #ffd27a; }

/* 进货 */
.plist { display: grid; gap: 8px; }
.pcard { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
.pcard.dim { opacity: 0.75; border-style: dashed; }
.pe { font-size: 32px; text-align: center; }
.pinfo b { font-size: 15px; } .pinfo small { color: #9fb3d1; }
.pmeta { font-size: 12px; color: #9fb3d1; margin: 3px 0; }
.pmeta i { font-style: normal; font-weight: 700; } .pmeta i.up { color: #ff8a8a; } .pmeta i.down { color: #6ee7a8; }
.pstock { display: flex; gap: 10px; font-size: 12px; color: #cfd8e6; flex-wrap: wrap; }
.pstock b { color: #fff; } .pstock .inc { color: #ffd27a; }
.pctl { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.price { display: flex; align-items: center; gap: 4px; }
.price button { min-height: 30px; width: 30px; padding: 0; font-size: 16px; }
.price span { min-width: 54px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.margin { font-size: 11px; color: #9fb3d1; }
.pctl .primary { display: flex; flex-direction: column; line-height: 1.2; border-radius: 12px; }
.pctl .primary small { font-size: 11px; opacity: 0.85; font-weight: 500; }
.lockcard { text-align: center; padding: 30px 16px; background: rgba(255,255,255,0.04); border-radius: 18px; border: 1px dashed var(--line); }
.lockcard .big { font-size: 54px; } .lockcard h3 { margin: 6px 0; } .lockcard p { color: #cfd8e6; font-size: 14px; }
.lockcard button { font-size: 16px; padding: 12px 26px; }

/* 人员 */
.scard { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 12px; margin-bottom: 10px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
.scard img { width: 84px; height: 105px; border-radius: 10px; object-fit: cover; background: #ddd; }
.sname b { font-size: 16px; } .sname small { color: #9fb3d1; font-size: 12px; }
.dot { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(255,255,255,0.1); color: #9fb3d1; margin-left: 4px; }
.dot.on { background: rgba(82, 183, 136, 0.25); color: #6ee7a8; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(244, 162, 97, 0.18); color: #ffc999; border: 1px solid rgba(244,162,97,0.3); white-space: nowrap; }
.chip i { font-style: normal; opacity: 0.6; margin-left: 4px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 12px; color: #cfd8e6; margin: 4px 0 6px; }
.stats label { display: flex; align-items: center; gap: 6px; }
.stats.wide label i { font-style: normal; color: #fff; width: 10px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; display: inline-block; min-width: 40px; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, #f4a261, #ffd166); border-radius: 3px; }
.bar.teal > span { background: linear-gradient(90deg, #2a9d8f, #6ee7a8); }
.mini { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: #cfd8e6; }
.stars { color: #ffd166; letter-spacing: -1px; } .stars i { color: rgba(255,255,255,0.15); font-style: normal; }
.seg { display: flex; align-items: center; gap: 4px; margin: 4px 0; font-size: 12px; color: #9fb3d1; flex-wrap: wrap; }
.seg span { width: 30px; }
.seg button { min-height: 28px; padding: 3px 10px; font-size: 12px; }
.sfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; flex-wrap: wrap; }
.sfoot b { color: #ffd27a; }
.adbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; margin-bottom: 10px; border-radius: 14px; background: rgba(42,157,143,0.15); font-size: 13px; flex-wrap: wrap; }

/* 简历 (履歴書风格) */
.resume { background: #fbfaf5; color: #222; border-radius: 10px; padding: 16px; font-size: 13px; line-height: 1.6; -webkit-user-select: text; user-select: text; }
.rhead { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #222; padding-bottom: 4px; margin-bottom: 10px; }
.rtitle { font-size: 22px; font-weight: 900; letter-spacing: 0.3em; } .rtitle small { font-size: 12px; letter-spacing: 0; color: #777; }
.rdate { font-size: 12px; color: #555; }
.rtop { display: grid; grid-template-columns: 1fr 96px; gap: 12px; margin-bottom: 10px; }
.rtop img { width: 96px; height: 120px; border: 1px solid #999; object-fit: cover; }
.resume table { width: 100%; border-collapse: collapse; }
.resume th, .resume td { border: 1px solid #bbb; padding: 4px 8px; text-align: left; vertical-align: top; }
.resume th { background: #efece2; width: 64px; font-weight: 700; white-space: nowrap; }
.resume td.nm { font-size: 18px; font-weight: 700; }
.resume .rt th { text-align: center; width: auto; }
.resume .r { text-align: right; white-space: nowrap; }
.rbox { border: 1px solid #bbb; border-top: none; padding: 6px 8px; }
.rt + .rbox { border-top: 1px solid #bbb; margin-top: 10px; }
.rbox b { display: block; font-size: 12px; color: #666; }
.rbox.memo { background: #fff8e1; margin-top: 10px; border: 1px dashed #d4a017; }
.rbox.memo .chip { background: #ffe8c2; color: #8a5300; border-color: #f4c27a; }
.rbox.memo .stats { color: #333; } .rbox.memo .stats.wide label i { color: #333; }
.rbox.memo .bar { background: rgba(0,0,0,0.1); }

/* 财报 */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.kpi { padding: 10px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
.kpi small { display: block; color: #9fb3d1; font-size: 12px; } .kpi b { font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi i { display: block; font-style: normal; font-size: 11px; color: #8b9ab1; }
.ftable { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 12px; }
.ftable th { text-align: left; color: #9fb3d1; font-size: 12px; padding: 8px 4px 2px; font-weight: 500; }
.ftable td { padding: 6px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ftable .r { text-align: right; } .ftable tr.sum td { font-weight: 900; font-size: 16px; border-bottom: none; }
.ftable.small { font-size: 12px; } .ftable.small small { color: #ffd27a; }
.losses { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 12px; border-radius: 12px; background: rgba(230,57,70,0.12); font-size: 13px; }
.losses > b { width: 100%; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 170px; padding: 8px 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
.chart .bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.chart .bars span { width: 40%; border-radius: 3px 3px 0 0; min-height: 1px; }
.chart .s, .legend .s { background: #2a9d8f; } .chart .c, .legend .c { background: #f4a261; }
.chart .partial .bars span { opacity: 0.55; }
.chart small { font-size: 9px; color: #8b9ab1; margin-top: 3px; white-space: nowrap; }
.legend { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #9fb3d1; margin-bottom: 8px; }
.legend span { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.rank { display: grid; gap: 6px; }
.rk { display: grid; grid-template-columns: 22px 30px 1fr 1fr 70px; gap: 8px; align-items: center; font-size: 13px; }
.rk .no { color: #9fb3d1; text-align: center; } .rk .e { font-size: 22px; }
.rk .n small { display: block; font-size: 11px; color: #8b9ab1; } .rk .v { text-align: right; font-size: 12px; color: #9fb3d1; } .rk .v b { color: #fff; }

/* 天气 */
.wnow { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; padding: 0 18px 10px; }
.wnow .big { font-size: 42px; }
.wnow b { font-size: 26px; display: block; } .wnow small { color: #9fb3d1; }
.wnow p { grid-column: span 2; margin: 4px 0 0; font-size: 12px; color: #8b9ab1; line-height: 1.6; }
.wlist { display: grid; gap: 6px; align-content: start; }
.wrow { display: grid; grid-template-columns: 72px 64px 66px 52px 1fr; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid transparent; }
.wrow.today { background: rgba(42,157,143,0.18); border-color: rgba(42,157,143,0.5); }
.wrow.we .wd b { color: #ffb4a2; }
.wd b { display: block; font-size: 16px; } .wd small, .wi small { color: #9fb3d1; font-size: 11px; white-space: nowrap; }

'use strict';
/* =========================================================
 * iso.js — 极简等距(2.5D)渲染工具
 * 世界坐标: x 向右下, y 向左下, z 向上 (单位≈1米)
 * ========================================================= */

const ISO = { W: 800, H: 600, dpr: 1, zoom: 1, panX: 0, panY: 0, TW: 64, TH: 32, TZ: 38, ctx: null };
const FONT = "'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','Microsoft YaHei',sans-serif";

let AMB = [1, 1, 1];                 // 当前环境光 (室外随时间变化)
const AMB_EMIT = [1, 1, 1];          // 自发光物体
const AMB_IN = [1.0, 0.98, 0.93];    // 店内灯光

const _rgb = new Map();
function hexRgb(h) {
  let v = _rgb.get(h);
  if (v) return v;
  let s = h.replace('#', '');
  if (s.length === 3) s = s.split('').map(c => c + c).join('');
  const n = parseInt(s, 16);
  v = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _rgb.set(h, v);
  return v;
}

/* ---------- 漫画风: 网点纸(screentone) ---------- */
const MANGA = {
  on: false, pats: {},
  pat(kind) {
    if (this.pats[kind]) return this.pats[kind];
    const n = kind === 'dark' ? 5 : 6, cv = document.createElement('canvas');
    cv.width = n; cv.height = n;
    const g = cv.getContext('2d');
    g.fillStyle = kind === 'dark' ? '#1a1a1a' : '#ffffff'; g.fillRect(0, 0, n, n);
    g.fillStyle = kind === 'dark' ? '#ffffff' : '#1a1a1a';
    const dot = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
    if (kind === 'light') dot(3, 3, 0.85);
    else if (kind === 'mid') { dot(1.5, 1.5, 1.15); dot(4.5, 4.5, 1.15); }
    else if (kind === 'dense') { dot(1.5, 1.5, 1.6); dot(4.5, 4.5, 1.6); dot(4.5, 1.5, 0.7); dot(1.5, 4.5, 0.7); }
    else dot(2.5, 2.5, 0.9);
    return (this.pats[kind] = ISO.ctx.createPattern(cv, 'repeat'));
  },
  tone(L) {
    if (L > 0.78) return '#ffffff';
    if (L > 0.6) return this.pat('light');

    if (L > 0.34) return this.pat('dense');
    if (L > 0.22) return this.pat('dark');
    return '#141414';

};

/** 把颜色按面朝向系数 f 和环境光 amb 计算成实际颜色 */
function lit(hex, f = 1, a = 1, amb = AMB) {
  const [r, g, b] = hexRgb(hex);
  const R = Math.min(255, r * f * amb[0]) | 0;
  const G = Math.min(255, g * f * amb[1]) | 0;
  const B = Math.min(255, b * f * amb[2]) | 0;
  if (MANGA.on) {
    if (a < 1) return `rgba(255,255,255,${Math.min(0.5, a * 0.8)})`;
    return MANGA.tone(0.28 + 0.72 * (0.299 * R + 0.587 * G + 0.114 * B) / 255);
  }
  return a < 1 ? `rgba(${R},${G},${B},${a})` : `rgb(${R},${G},${B})`;
}

function proj(x, y, z = 0) {
  const s = ISO.zoom;
  return [
    ISO.W / 2 + ISO.panX + (x - y) * ISO.TW / 2 * s,
    ISO.H / 2 + ISO.panY + ((x + y) * ISO.TH / 2 - z * ISO.TZ) * s,
  ];
}

function unproj(sx, sy) {
  const s = ISO.zoom;
  const a = (sx - ISO.W / 2 - ISO.panX) / (ISO.TW / 2 * s);
  const b = (sy - ISO.H / 2 - ISO.panY) / (ISO.TH / 2 * s);
  return [(a + b) / 2, (b - a) / 2];
}

function poly(pts, fill, stroke) {
  const c = ISO.ctx;
  c.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = proj(pts[i][0], pts[i][1], pts[i][2]);
    if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]);
  }
  c.closePath();
  c.fillStyle = fill;
  c.fill();
  if (MANGA.on) {
    c.strokeStyle = '#111'; c.lineWidth = stroke === false ? 0.5 : 0.9; c.lineJoin = 'round';

  } else if (stroke !== false) {
    c.strokeStyle = stroke || fill;
    c.lineWidth = 0.6;
    c.stroke();
  }
}

 * 长方体: 只画看得见的三个面 (顶面, y+d 左前面, x+w 右前面)
 * o: {emit, alpha, top, left, right, noTop, noLeft, noRight}

  const a = o.alpha == null ? 1 : o.alpha;
  if (a <= 0.01) return;
  const st = a < 1 ? false : undefined;

  if (!o.noLeft) poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], lit(o.left || color, 0.84, a, amb), st);

  if (!o.noTop) poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], lit(o.top || color, 1, a, amb), st);
  // 顶部前沿高光, 让方块边缘更利落
  if (!MANGA.on && !o.noTop && a >= 1 && w > 0.12 && d > 0.12 && ISO.zoom > 0.45) {
    const c = ISO.ctx, p1 = proj(x, y + d, z + h), p2 = proj(x + w, y + d, z + h), p3 = proj(x + w, y, z + h);
    c.strokeStyle = `rgba(255,255,255,${0.1 + 0.12 * Math.min(1, amb[0])})`; c.lineWidth = 0.9;

  poly([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]], lit(color, 1, a, o.emit ? AMB_EMIT : (o.amb || AMB)), a < 1 ? false : undefined);
}

  poly([[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]], lit(color, o.f || 0.84, a, o.emit ? AMB_EMIT : (o.amb || AMB)), a < 1 ? false : undefined);
}
function faceX(y0, y1, z0, z1, x, color, o = {}) {
  const a = o.alpha == null ? 1 : o.alpha;
  poly([[x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1]], lit(color, o.f || 0.68, a, o.emit ? AMB_EMIT : (o.amb || AMB)), a < 1 ? false : undefined);
}

/* 在某个平面上用 2D 方式作画: 本地 1 单位 = 0.01 米 */
function planeY(x, y, z, cb) { // 正面(朝 +y)，u→+x，v→向下
  const c = ISO.ctx, s = ISO.zoom * 0.01, p = proj(x, y, z);
  c.save(); c.transform(ISO.TW / 2 * s, ISO.TH / 2 * s, 0, ISO.TZ * s, p[0], p[1]); cb(c); c.restore();
}
function planeX(x, y, z, cb) { // 右侧面(朝 +x)，u→-y，v→向下
  const c = ISO.ctx, s = ISO.zoom * 0.01, p = proj(x, y, z);
  c.save(); c.transform(ISO.TW / 2 * s, -ISO.TH / 2 * s, 0, ISO.TZ * s, p[0], p[1]); cb(c); c.restore();
}
function planeZ(x, y, z, cb) { // 地面，u→+x，v→+y
  const c = ISO.ctx, s = ISO.zoom * 0.01, p = proj(x, y, z);
  c.save(); c.transform(ISO.TW / 2 * s, ISO.TH / 2 * s, -ISO.TW / 2 * s, ISO.TH / 2 * s, p[0], p[1]); cb(c); c.restore();
}

function line3(a, b, color, w = 1) {
  const c = ISO.ctx, p = proj(a[0], a[1], a[2]), q = proj(b[0], b[1], b[2]);
  c.strokeStyle = color; c.lineWidth = w * ISO.zoom;
  c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke();
}

/* ---------- 光晕 (叠加模式下使用) ---------- */
function glowAt(x, y, z, r, rgb, a) {
  const c = ISO.ctx, [sx, sy] = proj(x, y, z), R = r * ISO.TW * 0.5 * ISO.zoom;
  const g = c.createRadialGradient(sx, sy, 0, sx, sy, R);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g;
  c.beginPath(); c.arc(sx, sy, R, 0, Math.PI * 2); c.fill();
}
function poolAt(x, y, r, rgb, a, stretch = 1) {

  c.save(); c.translate(sx, sy); c.scale(stretch, 0.5);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, R);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fill();
  c.restore();
}

/* ---------- 深度排序 ---------- */
// 物体: {x0,y0,x1,y1, draw()}
function depthCmp(a, b) {
  if (a.x1 <= b.x0 && !(b.y1 <= a.y0)) return -1;
  if (b.x1 <= a.x0 && !(a.y1 <= b.y0)) return 1;
  if (a.y1 <= b.y0 && !(b.x1 <= a.x0)) return -1;
  if (b.y1 <= a.y0 && !(a.x1 <= b.x0)) return 1;
  return (a.x0 + a.x1 + a.y0 + a.y1) - (b.x0 + b.x1 + b.y0 + b.y1);
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

'use strict';
/* =========================================================
 * audio.js — WebAudio 合成音效 + 背景音乐 (无需音频文件)
 * ========================================================= */

const Sound = {
  ctx: null, master: null, sfx: null, bgmBus: null, bgmFilter: null, rainGain: null,
  muted: false, musicOn: true, chimeType: 'off',

  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : 0.7;
    this.master.connect(c.destination);
    // 音效总线: 削掉刺耳的高频
    const sfxLP = c.createBiquadFilter(); sfxLP.type = 'lowpass'; sfxLP.frequency.value = 3200;
    this.sfx = c.createGain(); this.sfx.gain.value = 0.9;
    this.sfx.connect(sfxLP); sfxLP.connect(this.master);
    // 门铃专用: 柔和的低通 + 一点回声, 听起来更有空间感
    const bellLP = c.createBiquadFilter(); bellLP.type = 'lowpass'; bellLP.frequency.value = 2200;
    this.bell = c.createGain(); this.bell.gain.value = 1;
    const dly = c.createDelay(); dly.delayTime.value = 0.21;
    const fb = c.createGain(); fb.gain.value = 0.28;
    const wet = c.createGain(); wet.gain.value = 0.35;
    this.bell.connect(bellLP); bellLP.connect(this.master);
    bellLP.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(this.master);
    // 音乐总线
    this.bgmFilter = c.createBiquadFilter(); this.bgmFilter.type = 'lowpass'; this.bgmFilter.frequency.value = 2400;
    this.bgmBus = c.createGain(); this.bgmBus.gain.value = this.musicOn ? 0.22 : 0;
    this.bgmBus.connect(this.bgmFilter); this.bgmFilter.connect(this.master);
    // 雨声
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
    this.rainGain = c.createGain(); this.rainGain.gain.value = 0;
    src.connect(lp); lp.connect(hp); hp.connect(this.rainGain); this.rainGain.connect(this.master);
    src.start();
    Music.start();
  },

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.7, this.ctx.currentTime, 0.05); },
  setMusic(on) { this.musicOn = on; if (this.bgmBus) this.bgmBus.gain.setTargetAtTime(on ? 0.22 : 0, this.ctx.currentTime, 0.4); },
  setRain(v) { if (this.rainGain) this.rainGain.gain.setTargetAtTime(v * 0.1, this.ctx.currentTime, 0.5); },
  setNight(n) { if (this.bgmFilter) this.bgmFilter.frequency.setTargetAtTime(2400 - n * 1100, this.ctx.currentTime, 2); },

  tone(freq, start, dur, type = 'sine', vol = 0.2, attack = 0.012, out) {

/* =========================================================
 * 背景音乐: 程序生成的 lo-fi 爵士 (每次播放都有点不一样)
 * ========================================================= */
const Music = {
  bpm: 74, step: 0, next: 0, timer: null, bar: 0,
  // 和弦进行 (MIDI): Fmaj7 - Em7 - Dm7 - Cmaj7 / Fmaj7 - Em7 - Am7 - G7sus
  prog: [
    [53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59],
    [53, 57, 60, 64], [52, 55, 59, 62], [45, 48, 52, 55], [43, 48, 50, 53],
  ],
  scale: [72, 74, 76, 79, 81, 84, 86],   // C 大调五声音阶
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },

  start() {
    if (this.timer || !Sound.ctx) return;
    this.next = Sound.ctx.currentTime + 0.3;
    this.timer = setInterval(() => this.schedule(), 120);
  },
  schedule() {
    const c = Sound.ctx;
    if (!c || c.state !== 'running') return;
    const s16 = 60 / this.bpm / 4;
    while (this.next < c.currentTime + 0.4) {
      this.play(this.step, this.next);
      // 轻微的摇摆感
      this.next += s16 * (this.step % 2 ? 0.86 : 1.14);
      this.step = (this.step + 1) % 16;
      if (this.step === 0) this.bar = (this.bar + 1) % this.prog.length;
    }
  },
  epiano(m, t, dur, vol) {
    const c = Sound.ctx, f = this.mtof(m), out = Sound.bgmBus;
    for (const [mul, v, det] of [[1, 1, -4], [1, 0.6, 5], [2, 0.12, 0]]) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f * mul; o.detune.value = det;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  play(step, t) {
    const c = Sound.ctx, chord = this.prog[this.bar], out = Sound.bgmBus;
    // 和弦 (每小节第 1 拍, 偶尔在第 3 拍补一下)
    if (step === 0) chord.forEach((m, i) => this.epiano(m, t + i * 0.012, 3.2, 0.11));
    if (step === 10 && Math.random() < 0.5) chord.slice(1).forEach(m => this.epiano(m + 12, t, 1.4, 0.04));
    // 贝斯
    if (step === 0 || step === 8 || (step === 14 && Math.random() < 0.4)) {
      const root = chord[0] - 12 + (step === 14 ? 7 : 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = this.mtof(root);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 1);
    }
    // 轻轻的鼓: 底鼓 + 闷闷的军鼓 + 沙沙的踩镲
    if (step === 0 || step === 7 || step === 10) {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
      g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.3);
    }
    const noiseHit = (vol, dur, freq, type) => {
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = Sound.noise; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random()); s.stop(t + dur + 0.02);
    };
    if (step === 4 || step === 12) noiseHit(0.09, 0.18, 1800, 'bandpass');
    if (step % 2 === 0) noiseHit(step % 4 ? 0.025 : 0.04, 0.05, 7000, 'highpass');
    // 旋律: 稀疏随机的五声音阶
    if (step % 2 === 0 && Math.random() < 0.22) {
      const m = this.scale[(Math.random() * this.scale.length) | 0];
      const o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
      o.type = 'sine'; o.frequency.value = this.mtof(m);
      lfo.frequency.value = 5; lg.gain.value = 3; lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(g); g.connect(out); o.start(t); lfo.start(t); o.stop(t + 1.2); lfo.stop(t + 1.2);
    }
  },
};

/** 某个货架每一格画什么 (按陈列计划和库存) */
function unitsFor(fid, slots) {
  const arr = (G.plan && G.plan[fid]) || [], seen = {}, out = [];
  for (let i = 0; i < slots; i++) {
    const pid = arr[i];
    if (!pid) { out.push(null); continue; }
    const k = seen[pid] = (seen[pid] || 0) + 1;
    out.push(G.inv[pid] && G.inv[pid].shelf > (k - 1) * PER_FACE ? pid : null);
  }
  return out;
}

function drawLabel(text, color, x, y, z, w, along) {
  const fn = along === 'x' ? planeX : planeY;
  fn(x, y, z, g => {
    g.fillStyle = color; g.font = `bold 15px ${FONT}`; g.textBaseline = 'top';
    g.fillText(text, 8, 4, w * 100 - 16);
  });
}

function drawFixture(cat) {
  const C = CAT_BY_ID[cat], [x, y, z, w, d, h] = C.box, A = { amb: AMB_IN };
  const units = unitsFor(cat, C.face === 'fridge' ? 21 : C.face === 'freezer' ? 12 : C.face === 'mag' ? 10 : 9);
  switch (C.face) {
    case 'top': {
      box(x, y, 0, w, d, h, '#b98a57', { top: '#d2a676', amb: AMB_IN });
      faceY(x, x + w, h - 0.14, h - 0.02, y + d + 0.002, C.color, A);
      const step = (w - 0.3) / 8;
      units.forEach((pid, i) => pid && drawProductUnit(pid, x + 0.08 + i * step, y + 0.18, h, i));
      break;
    }
    case 'y': {
      const tiers = [0.15, 0.6, 1.05];
      box(x, y, 0, w, d, 0.15, '#6b6f76', A);
      box(x, y, 0.15, w, 0.12, h - 0.15, THEME.shelf, A);
      box(x, y, 0.15, 0.06, d, h - 0.15, THEME.shelf2, A);
      const cw = (w - 0.12) / 3;
      for (let t = 0; t < 3; t++) {
        if (t) box(x + 0.06, y + 0.12, tiers[t], w - 0.12, d - 0.12, 0.04, THEME.plank, A);
        for (let c = 0; c < 3; c++) { const pid = units[t * 3 + c]; if (pid) drawProductUnit(pid, x + 0.1 + c * cw, y + d - 0.32, tiers[t] + 0.04, t * 3 + c); }
      }
      box(x + w - 0.06, y, 0.15, 0.06, d, h - 0.15, THEME.shelf2, A);
      box(x, y + d - 0.04, h, w, 0.04, 0.22, C.color, A);
      drawLabel(C.jp, '#ffffff', x, y + d + 0.002, h + 0.21, w, 'y');
      break;
    }
    case 'x': {
      const tiers = [0.15, 0.7, 1.25];
      box(x, y, 0, w, d, 0.15, '#6b6f76', A);
      box(x, y, 0.15, 0.12, d, h - 0.15, THEME.shelf, A);
      box(x, y, 0.15, w, 0.06, h - 0.15, THEME.shelf2, A);
      const cd = (d - 0.12) / 3;
      for (let t = 0; t < 3; t++) {
        if (t) box(x + 0.12, y + 0.06, tiers[t], w - 0.12, d - 0.12, 0.04, THEME.plank, A);
        for (let c = 0; c < 3; c++) { const pid = units[t * 3 + c]; if (pid) drawProductUnit(pid, x + w - 0.24, y + 0.1 + c * cd, tiers[t] + 0.04, t * 3 + c); }
      }
      box(x, y + d - 0.06, 0.15, w, 0.06, h - 0.15, THEME.shelf2, A);
      box(x + w - 0.04, y, h, 0.04, d, 0.22, C.color, A);
      drawLabel(C.jp, '#ffffff', x + w + 0.002, y + d, h + 0.21, d, 'x');
      break;
    }
    case 'fridge': {
      box(x, y, 0, w, d, h, '#cfd3d8', A);
      const fy = y + d + 0.003;
      faceY(x + 0.08, x + w - 0.08, 0.12, h - 0.2, fy, '#e6f4ff', { emit: true });
      const tiers = [0.2, 0.75, 1.3];
      const dw = (w - 0.16) / 7;
      for (let t = 0; t < 3; t++) for (let c = 0; c < 7; c++) {
        const pid = units[t * 7 + c];
        if (pid) drawProductUnit(pid, x + 0.16 + c * dw, fy - 0.15, tiers[t], c);
      }
      for (let i = 0; i <= 7; i++) faceY(x + 0.06 + i * dw, x + 0.1 + i * dw, 0.12, h - 0.2, fy + 0.002, '#9aa3ad', A);
      for (let i = 0; i < 7; i++) faceY(x + 0.1 + i * dw + dw - 0.14, x + 0.1 + i * dw + dw - 0.1, 0.7, 1.2, fy + 0.004, '#cfd6de', A);
      faceY(x + 0.08, x + w - 0.08, 0.12, h - 0.2, fy + 0.004, '#ffffff', { emit: true, alpha: 0.12 });
      box(x, y + d - 0.02, h - 0.2, w, 0.04, 0.2, C.color, A);
      drawLabel('ドリンク  ·  DRINKS  ·  ビール', '#ffffff', x + 2.4, fy + 0.006, h - 0.02, 3, 'y');
      break;
    }
    case 'daily': {
      box(x, y, 0, w, d, 0.5, '#34495e', A);
      const um = units.filter(u => u && PRODUCT_BY_ID[u].look[0] === 'umbrella');
      const other = units.filter(u => u && PRODUCT_BY_ID[u].look[0] !== 'umbrella');
      um.forEach((pid, i) => drawProductUnit(pid, x + 0.06 + (i % 3) * 0.12, y + 0.08 + Math.floor(i / 3) * 0.12, 0.5, i));
      box(x, y, 0.5, w, 0.1, 0.5, '#34495e', A);
      other.forEach((pid, i) => drawProductUnit(pid, x + 0.05 + (i % 2) * 0.18, y + 0.02, 1.0, i));
      faceY(x, x + w, 0.3, 0.45, y + d + 0.002, '#e6eef8', A);
      planeY(x + 0.02, y + d + 0.004, 0.44, g => { g.fillStyle = '#1d3557'; g.font = `bold 11px ${FONT}`; g.textBaseline = 'top'; g.fillText('傘 ¥' + G.price.umbrella, 2, 1); });
      break;
    }
    case 'freezer': {
      box(x, y, 0, w, d, h, '#f4f6f8', { top: '#c9e6f5', amb: AMB_IN });
      faceY(x + 0.05, x + w - 0.05, 0.1, 0.25, y + d + 0.002, C.color, A);
      units.forEach((pid, i) => pid && drawProductUnit(pid, x + 0.1 + (i % 6) * 0.33, y + 0.1 + Math.floor(i / 6) * 0.2, h, i));
      flat(x + 0.04, y + 0.04, x + w - 0.04, y + d - 0.04, h + 0.12, '#e8f7ff', { emit: true, alpha: 0.28 });
      box(x, y + d - 0.04, h, w, 0.04, 0.14, '#5aa9e6', A);
      planeY(x + 0.05, y + d + 0.002, h + 0.13, g => { g.fillStyle = '#fff'; g.font = `bold 11px ${FONT}`; g.textBaseline = 'top'; g.fillText('アイスクリーム  ICE', 4, 1); });
      break;
    }
    case 'mag': {
      box(x, y, 0, w, d, 0.55, '#8a6d5a', { top: '#a5876f', amb: AMB_IN });
      box(x, y + 0.04, 0.55, w, 0.12, 0.4, '#7a5f4e', A);
      units.forEach((pid, i) => pid && drawProductUnit(pid, x + 0.1 + (i % 5) * 0.54 + Math.floor(i / 5) * 0.27, y + 0.2 - Math.floor(i / 5) * 0.08, 0.55, i));
      faceY(x, x + w, 0.38, 0.5, y + d + 0.002, C.color, A);
      planeY(x + 0.05, y + d + 0.004, 0.49, g => { g.fillStyle = '#fff'; g.font = `bold 10px ${FONT}`; g.textBaseline = 'top'; g.fillText('MAGAZINE · 雑誌 · 新聞', 4, 1); });
      break;
    }
    case 'hot': {
      const on = G.unlocked.hot;
      box(x, y, z, w, d, h, on ? '#f2b866' : '#6b6f76', { emit: on, alpha: 0.9 });
      units.forEach((pid, i) => pid && drawProductUnit(pid, x + 0.08 + (i % 3) * 0.14, y + 0.06 + Math.floor(i / 3) * 0.18, z + 0.06 + Math.floor(i / 3) * 0.0, i));
      planeY(x + 0.02, y + d + 0.003, z + 0.42, g => { g.fillStyle = on ? '#7a3b00' : '#ddd'; g.font = `bold 11px ${FONT}`; g.textBaseline = 'top'; g.fillText(on ? 'ホット' : '準備中', 4, 2); });
      break;
    }
  }
}

/** 货架物件 (按解锁情况动态生成) */
function fixtureItems() {
  const list = [];
  for (const C of CATEGORIES) {
    if (C.face === 'hot') continue;
    const [x, y, , w, d] = C.box;
    if (G.unlocked[C.id]) list.push(item(x, y, x + w, y + d, () => drawFixture(C.id)));
    else if (C.id === 'magazine') list.push(item(x, y, x + w, y + d, () => { box(x, y, 0, w, d, 0.55, '#8a8f96', { amb: AMB_IN }); planeY(x + 0.1, y + d + 0.003, 0.45, g => { g.fillStyle = '#fff'; g.font = `bold 12px ${FONT}`; g.textBaseline = 'top'; g.fillText('準備中 · 敬请期待', 4, 2); }); }));
    else if (C.id === 'ice') list.push(item(x, y, x + w, y + d, () => { box(x, y, 0, w, d, 0.82, '#c9ced4', { amb: AMB_IN }); planeY(x + 0.1, y + d + 0.003, 0.6, g => { g.fillStyle = '#555'; g.font = `bold 12px ${FONT}`; g.textBaseline = 'top'; g.fillText('準備中', 4, 2); }); }));
  }
  return list;
}

  const x = VEND_X[i], y = 6.2, w = 0.85, d = 0.7, h = 1.9;
  const vm = G.vend ? G.vend[i] : VEND_DEFS[i];
  const def = VEND_DEFS[i], fy = y + d + 0.002;

function drawCar(cx, cy, axis, facing, color, env, lightsOn) {
  const L = 2.3, Wd = 1.15;
  const dark = '#1c2430', glass = '#2b3b52';
  if (axis === 'y') {
    const x = cx - Wd / 2, y = cy - L / 2;
    for (const [wx, wy] of [[x - 0.02, y + 0.3], [x - 0.02, y + L - 0.75], [x + Wd - 0.16, y + 0.3], [x + Wd - 0.16, y + L - 0.75]]) box(wx, wy, 0, 0.18, 0.45, 0.38, dark);
    box(x, y, 0.22, Wd, L, 0.6, color);
    box(x + 0.08, y + 0.4, 0.82, Wd - 0.16, L - 1.0, 0.5, color, { left: glass, right: glass });
    box(x + 0.08, y + 0.4, 1.3, Wd - 0.16, L - 1.0, 0.04, '#d8d8d8');
    faceY(x + 0.1, x + 0.3, 0.55, 0.68, y + L + 0.002, lightsOn ? '#fff6d0' : '#cfcfcf', { emit: lightsOn });
    faceY(x + Wd - 0.3, x + Wd - 0.1, 0.55, 0.68, y + L + 0.002, lightsOn ? '#fff6d0' : '#cfcfcf', { emit: lightsOn });
    faceY(x + 0.35, x + Wd - 0.35, 0.3, 0.42, y + L + 0.002, '#e9e9e9');
    return;
  }
  const x = cx - L / 2, y = cy - Wd / 2;
  for (const [wx, wy] of [[x + 0.3, y - 0.02], [x + L - 0.75, y - 0.02], [x + 0.3, y + Wd - 0.16], [x + L - 0.75, y + Wd - 0.16]]) box(wx, wy, 0, 0.45, 0.18, 0.38, dark);
  box(x, y, 0.22, L, Wd, 0.6, color);
  const cabX = facing > 0 ? x + 0.35 : x + 0.65;
  box(cabX, y + 0.08, 0.82, L - 1.0, Wd - 0.16, 0.5, color, { left: glass, right: glass });
  if (facing > 0) {
    faceX(y + 0.1, y + 0.3, 0.55, 0.7, x + L + 0.002, '#fff6d0', { emit: lightsOn });
    faceX(y + Wd - 0.3, y + Wd - 0.1, 0.55, 0.7, x + L + 0.002, '#fff6d0', { emit: lightsOn });
  } else {
    faceX(y + 0.1, y + 0.3, 0.55, 0.7, x + L + 0.002, '#ff3b3b', { emit: lightsOn });
    faceX(y + Wd - 0.3, y + Wd - 0.1, 0.55, 0.7, x + L + 0.002, '#ff3b3b', { emit: lightsOn });
  }
}

'use strict';
/* =========================================================
 * shelves.js — 货架陈列 (每一格放什么由玩家决定)
 *
 *  - 每一格(facing) 能摆 PER_FACE 件商品 → 格子越多, 货架上能放越多, 越不容易缺货
 *  - 格子越多越显眼 → 人气越高; 中间「黄金层」再 +15%
 *  - 没有摆出来的商品, 客人买不到
 * ========================================================= */

const PER_FACE = 3;
const AMBIENT = ['rice', 'bread', 'noodle', 'snack', 'daily'];
const FIX = {
  rice: { name: 'A 货架', sub: '店中央 · 冷柜前', cols: 3, tiers: 3, accepts: AMBIENT, style: 'gondola' },
  bread: { name: 'B 货架', sub: '店中央 · 靠门口', cols: 3, tiers: 3, accepts: AMBIENT, style: 'gondola', impulse: 1.05 },
  snack: { name: 'C 货架', sub: '右侧 · 收银台旁', cols: 3, tiers: 3, accepts: AMBIENT, style: 'gondola', impulse: 1.08 },
  noodle: { name: '墙边货架', sub: '左墙', cols: 3, tiers: 3, accepts: AMBIENT, style: 'gondola' },
  drink: { name: '冷藏饮料柜', sub: '后墙 · 7 扇门', cols: 7, tiers: 3, accepts: ['drink'], style: 'fridge' },
  ice: { name: '冷冻柜', sub: '冰柜', cols: 6, tiers: 2, accepts: ['ice'], style: 'freezer' },
  hot: { name: '热食柜', sub: '收银台上', cols: 3, tiers: 3, accepts: ['hot'], style: 'hot' },
  magazine: { name: '杂志架', sub: '橱窗边', cols: 5, tiers: 2, accepts: ['magazine'], style: 'mag' },
  daily: { name: '门口伞架', sub: '入口旁', cols: 3, tiers: 3, accepts: ['daily'], style: 'daily' },
};
const FIX_ORDER = ['rice', 'bread', 'snack', 'noodle', 'drink', 'ice', 'hot', 'magazine', 'daily'];
const fixSlots = fid => FIX[fid].cols * FIX[fid].tiers;
const fixOpen = fid => !!(G.unlocked && G.unlocked[fid]);
function tierLabel(fid, t) {
  const n = FIX[fid].tiers;
  if (n === 3) return ['下层', '黄金层', '上层'][t];
  return ['下层', '上层'][t];
}
const isGolden = (fid, t) => FIX[fid].tiers === 3 && t === 1;

/* 列优先的格子顺序: 每一列从下到上, 这样一个商品占一整列就同时有上中下三层 */
function colMajor(fid) {
  const { cols, tiers } = FIX[fid], out = [];
  for (let c = 0; c < cols; c++) for (let t = 0; t < tiers; t++) out.push(t * cols + c);
  return out;
}

/* ---------------- 查询 ---------------- */
function facingList(pid) {
  const out = [];
  if (!G.plan) return out;
  for (const fid of FIX_ORDER) {
    if (!fixOpen(fid)) continue;
    const arr = G.plan[fid]; if (!arr) continue;
    arr.forEach((p, i) => { if (p === pid) out.push({ fid, i, t: Math.floor(i / FIX[fid].cols) }); });
  }
  return out;
}
function facings(pid) { return facingList(pid).length; }
function shelfCap(pid) { return facings(pid) * PER_FACE; }
function displayedOn(fid) { return [...new Set((G.plan[fid] || []).filter(Boolean))].map(id => PRODUCT_BY_ID[id]); }
function displayed(pid) { return facings(pid) > 0; }

/** 显眼程度 → 人气倍率 */
function visibility(pid) {
  const f = facingList(pid);
  if (!f.length) return 0;
  let v = Math.min(1.7, 0.7 + 0.2 * f.length);
  if (f.some(x => isGolden(x.fid, x.t))) v *= 1.15;
  else if (f.every(x => FIX[x.fid].tiers === 3 && x.t === 0)) v *= 0.9;
  v *= Math.max(...f.map(x => FIX[x.fid].impulse || 1));
  return v;
}

function clampShelf(pid) {
  const inv = G.inv[pid], cap = shelfCap(pid);
  if (inv.shelf > cap) { inv.back += inv.shelf - cap; inv.shelf = cap; }
}
function canPlace(fid, pid) { return !pid || FIX[fid].accepts.includes(PRODUCT_BY_ID[pid].cat); }

function setSlot(fid, i, pid) {
  if (!canPlace(fid, pid)) return false;
  const old = G.plan[fid][i];
  G.plan[fid][i] = pid || null;
  if (old && old !== pid) clampShelf(old);
  return true;
}

/* ---------------- 初始陈列 / 自动陈列 ---------------- */
function emptyPlan() { const p = {}; for (const fid of FIX_ORDER) p[fid] = Array(fixSlots(fid)).fill(null); return p; }

function defaultPlan() {

function genApplicant() {

function updateStaff(dt) {

    const working = onShift(st, h);
    if (working && !rt) {
      rt = G.staffRT[st.id] = { x: STAFF_HOME[0], y: STAFF_HOME[1], path: [], state: 'idle', timer: 0, alpha: 0, phase: 0, speed: 1.5, dir: [0, 1], look: staffLook(st), umbrella: 0, st };

function drawPortrait(L, gender, age) {

  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(cx - 16, 112); g.lineTo(cx + 16, 112); g.lineTo(cx, 140); g.closePath(); g.fill();
  if (gender === 'm') { g.fillStyle = pick(['#8b1e3f', '#1d3557', '#2a6f5f']); g.beginPath(); g.moveTo(cx - 4, 116); g.lineTo(cx + 4, 116); g.lineTo(cx + 6, 140); g.lineTo(cx - 6, 140); g.closePath(); g.fill(); }

  } else {
    g.moveTo(cx - hw - 3, hy + (L.style === 2 || L.style === 1 ? 14 : -2));
    g.quadraticCurveTo(cx - hw - 2, hy - hh - 10, cx, hy - hh - 7);
    g.quadraticCurveTo(cx + hw + 2, hy - hh - 10, cx + hw + 3, hy + (L.style === 2 || L.style === 1 ? 14 : -2));
    g.lineTo(cx + hw - 5, hy - 14);
    if (gender === 'f') { g.quadraticCurveTo(cx + 6, hy - 14, cx - 4, hy - 30); g.quadraticCurveTo(cx - 14, hy - 16, cx - hw + 5, hy - 12); }
    else { g.lineTo(cx + 12, hy - 22); g.lineTo(cx + 2, hy - 16); g.lineTo(cx - 10, hy - 24); g.lineTo(cx - hw + 5, hy - 14); }
  }

  // 眉毛

  g.beginPath(); g.moveTo(cx - 20, hy - 9); g.lineTo(cx - 8, hy - 10); g.moveTo(cx + 8, hy - 10); g.lineTo(cx + 20, hy - 9); g.stroke();

    else if (L.eye === 1) { g.beginPath(); g.arc(ex, ey + 2, 5, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }

  }
  if (L.glasses) {
    g.strokeStyle = '#333'; g.lineWidth = 2;
    g.beginPath(); g.arc(cx - 13, ey, 9, 0, 7); g.moveTo(cx + 22, ey); g.arc(cx + 13, ey, 9, 0, 7); g.moveTo(cx - 4, ey); g.lineTo(cx + 4, ey); g.stroke();

  // 鼻子嘴巴
  g.strokeStyle = 'rgba(120,70,50,0.6)'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx, ey + 8); g.lineTo(cx - 2, ey + 13); g.stroke();
  g.strokeStyle = '#8a3b3b'; g.fillStyle = '#8a3b3b'; g.lineWidth = 2.4;

  else if (L.mouth === 1) { g.beginPath(); g.moveTo(cx - 6, ey + 21); g.lineTo(cx + 6, ey + 21); g.stroke(); }
  else { g.beginPath(); g.moveTo(cx - 8, ey + 18); g.quadraticCurveTo(cx, ey + 30, cx + 8, ey + 18); g.closePath(); g.fill(); }
  if (age >= 55) { g.strokeStyle = 'rgba(120,80,60,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - 25, ey + 12); g.lineTo(cx - 20, ey + 18); g.moveTo(cx + 25, ey + 12); g.lineTo(cx + 20, ey + 18); g.stroke(); }
  return c.toDataURL();
}

/* ================= 自动贩卖机 ================= */
function vendChance(i) {

  if (!d.hot && !d.cold) p *= T > 24 ? 1.6 : 1;
  const ratio = vm.price / d.price;
  p *= ratio <= 1 ? 1 + (1 - ratio) : Math.max(0, 1 - (ratio - 1) * 2);

}

/* ---------------- 相机 ---------------- */
const cam = { anim: null };
function fitZoom() { return isPortrait() ? ISO.W / 1150 : Math.min(ISO.W / 1250, ISO.H / 820); }
function setView(wx, wy, wz, zoom, offY = 0) {
  ISO.zoom = zoom;
  ISO.panX = -((wx - wy) * ISO.TW / 2 * zoom);
  ISO.panY = -(((wx + wy) * ISO.TH / 2 - wz * ISO.TZ) * zoom) + offY;
}
const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
const isPortrait = () => ISO.H > ISO.W * 1.05;
const VIEW_TITLE = () => isPortrait()
  ? [10, 5.6, 1.2, ISO.W / 820, -ISO.H * 0.2]
  : [10.5, 6.6, 1.0, fitZoom() * 0.95, -ISO.H * 0.15];
const VIEW_GAME = () => isPortrait()
  ? [9.0, 4.3, 0.9, clamp(ISO.W / 590, 0.35, 2.2), -ISO.H * 0.02]
  : [9.4, 4.7, 0.8, Math.min(ISO.W / 720, ISO.H / 560), ISO.H < 500 ? 0 : 10];
function animateView(to, dur = 1.6) {
  const from = { zoom: ISO.zoom, panX: ISO.panX, panY: ISO.panY };
  setView(...to);
  const target = { zoom: ISO.zoom, panX: ISO.panX, panY: ISO.panY };
  Object.assign(ISO, from);
  cam.anim = { from, target, t: 0, dur };
}
function updateCam(dt) {
  if (!cam.anim) return;
  const a = cam.anim; a.t += dt;
  const k = clamp(a.t / a.dur, 0, 1), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  ISO.zoom = lerp(a.from.zoom, a.target.zoom, e);
  ISO.panX = lerp(a.from.panX, a.target.panX, e);
  ISO.panY = lerp(a.from.panY, a.target.panY, e);
  if (k >= 1) cam.anim = null;
}

function resize() {
  ISO.dpr = Math.min(2, window.devicePixelRatio || 1);
  ISO.W = window.innerWidth; ISO.H = window.innerHeight;
  canvas.width = Math.round(ISO.W * ISO.dpr);
  canvas.height = Math.round(ISO.H * ISO.dpr);
  canvas.style.width = ISO.W + 'px'; canvas.style.height = ISO.H + 'px';
  // 手机地址栏伸缩只改变高度, 此时不重置玩家拖动过的视角
  if (Math.abs(ISO.W - (resize.lastW || 0)) > 1 || !G.started) setView(...(G.started ? VIEW_GAME() : VIEW_TITLE()));
  resize.lastW = ISO.W;
  initDrops();
}

/* ---------------- 时间 / 天气 / 光照 ---------------- */
function nightness(h) {
  if (h >= 19.5 || h < 4.5) return 1;
  if (h < 6.5) return 1 - (h - 4.5) / 2;
  if (h < 17) return 0;
  return (h - 17) / 2.5;
}
function mix3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function computeLight() {
  const h = G.minute / 60, N = nightness(h), r = G.rain;
  const dk = G.started && G.wx && G.wx[G.day] ? WEATHER[G.wx[G.day].t.type].dark : 0;
  const day = [1 - 0.2 * r - dk * 0.4, 1 - 0.2 * r - dk * 0.4, 1 - 0.15 * r - dk * 0.3];
  let a = mix3(day, [0.27, 0.31, 0.5], N);
  const w = Math.max(0, 1 - Math.abs(h - 18) / 1.3, 1 - Math.abs(h - 5.6) / 1.0) * (1 - 0.5 * r);
  a = [a[0] * lerp(1, 1.08, w), a[1] * lerp(1, 0.8, w), a[2] * lerp(1, 0.72, w)];
  AMB = a;
  env.night = N; env.rain = r; env.cut = G.cut; env.door = G.door; env.minute = G.minute;
  // 背景色
  const dayTop = mix3([150, 185, 215], [120, 132, 148], r), dayBot = mix3([225, 233, 240], [170, 178, 188], r);
  let top = mix3(dayTop, [12, 18, 34], N), bot = mix3(dayBot, [4, 6, 11], N);
  top = mix3(top, [70, 58, 96], w * 0.8); bot = mix3(bot, [229, 150, 105], w * 0.8);
  env.bgTop = top.map(v => v | 0); env.bgBot = bot.map(v => v | 0);
}

/* ---------------- 雨 ---------------- */
function initDrops() {
  G.drops = [];
  const nDrops = Math.min(520, Math.round(ISO.W * ISO.H / 1900));
  for (let i = 0; i < nDrops; i++) G.drops.push({ x: Math.random() * ISO.W, y: Math.random() * ISO.H, l: rand(10, 22), v: rand(650, 950) });
}
function updateRain(dt) {
  for (const d of G.drops) {
    d.y += d.v * dt; d.x += d.v * 0.16 * dt;
    if (d.y > ISO.H) { d.y = -d.l; d.x = Math.random() * ISO.W * 1.1 - ISO.W * 0.1; }
  }
  const n = G.rain * 60 * dt;
  for (let i = 0; i < n; i++) {
    const x = rand(0, BOARD.w), y = rand(0, BOARD.h);
    const inStore = x > STORE.x0 && x < STORE.x1 && y > STORE.y0 && y < STORE.y1;
    if (inStore && G.cut > 0.5) continue;
    G.ripples.push({ x, y, z: inStore ? STORE.H + 0.16 : 0.02, t: 0 });
  }
  G.ripples = G.ripples.filter(r => (r.t += dt) < 0.45);
}
function drawRain() {
  if (G.rain < 0.02) return;
  const c = ctx;
  if (G.snow) {
    c.fillStyle = `rgba(245,248,255,${0.8 * G.rain})`;
    const n = Math.min(G.drops.length, (G.drops.length * G.rain * 0.6) | 0);
    for (let i = 0; i < n; i++) {
      const d = G.drops[i], sx = (d.x + Math.sin(G.time * 1.5 + i) * 12) % ISO.W, sy = (d.y * 0.35 + i * 37) % ISO.H;
      c.beginPath(); c.arc(sx, sy, 1.2 + (i % 3) * 0.7, 0, 7); c.fill();
    }
    return;
  }
  c.strokeStyle = MANGA.on ? (env.night > 0.5 ? `rgba(255,255,255,${0.6 * G.rain})` : `rgba(0,0,0,${0.45 * G.rain})`) : `rgba(200,215,240,${0.35 * G.rain})`; c.lineWidth = 1;
  c.beginPath();
  const n = Math.min(G.drops.length, (G.drops.length * G.rain) | 0);
  for (let i = 0; i < n; i++) {
    const d = G.drops[i];
    c.moveTo(d.x, d.y); c.lineTo(d.x - d.l * 0.16, d.y - d.l);
  }
  c.stroke();
  for (const r of G.ripples) {
    const [sx, sy] = proj(r.x, r.y, r.z), k = r.t / 0.45;
    c.strokeStyle = `rgba(210,225,250,${0.5 * (1 - k) * G.rain})`;
    c.beginPath(); c.ellipse(sx, sy, (2 + 9 * k) * ISO.zoom, (1 + 4.5 * k) * ISO.zoom, 0, 0, 7); c.stroke();
  }
}

/* ---------------- 顾客 AI ---------------- */
function demandWeight(p) {
  if (!G.unlocked[p.cat] || !G.carried[p.id]) return 0;
  const h = G.minute / 60, T = G.temp == null ? 15 : G.temp;
  let w = p.pop * ((G.trend && G.trend[p.id]) || 1) * visibility(p.id) * upgradeDemand(p.cat);
  if (!w) return 0;
  if (p.morning && h >= 6 && h < 10) w *= 1.8;
  if (p.lunch && h >= 11 && h < 14) w *= 1 + p.lunch;
  if (p.night && (h >= 20 || h < 4)) w *= 1 + p.night;
  if (p.heat) w *= clamp(Math.exp(p.heat * (T - 17) / 9), 0.12, 4);
  if (p.rain) w *= 1 + p.rain * G.rain;
  const r = priceRatio(p.id);
  w *= r < 1 ? 1 + (1 - r) * 1.2 : Math.max(0.15, acceptance(p.id));
  return w;
}

function chooseWants() {
  const r = Math.random(), n = r < 0.28 ? 1 : r < 0.62 ? 2 : r < 0.86 ? 3 : 4;
  const pool = PRODUCTS.map(p => [p, demandWeight(p)]).filter(x => x[1] > 0);
  const out = [];
  while (out.length < n && pool.length) {
    const it = wpick(pool, x => x[1]);
    out.push(it[0].id);
    pool.splice(pool.indexOf(it), 1);
  }
  const shelf = out.filter(id => PRODUCT_BY_ID[id].cat !== 'hot');
  const hot = out.filter(id => PRODUCT_BY_ID[id].cat === 'hot');
  const yOf = id => { const f = facingList(id)[0]; return f && CAT_BY_ID[f.fid].stand ? CAT_BY_ID[f.fid].stand[1] : 9; };
  shelf.sort((a, b) => yOf(a) - yOf(b));
  return [shelf, hot];
}

function spawnCustomer(opt = {}) {
  const fromLeft = opt.fromLeft ?? Math.random() < 0.5, sx = fromLeft ? 0.05 : BOARD.w - 0.05;
  let [wants, hot] = chooseWants();
  if (opt.wants) { wants = opt.wants.filter(id => PRODUCT_BY_ID[id].cat !== 'hot'); hot = opt.wants.filter(id => PRODUCT_BY_ID[id].cat === 'hot'); }
  const lane = LANE_CUSTOMER + rand(-0.12, 0.12);
  const c = {
    kind: 'customer', x: sx, y: lane, look: opt.look ? { ...randomLook(), ...opt.look } : randomLook(), wants, hot, got: [],
    state: 'walkIn', path: [[DOOR.cx + rand(-0.2, 0.2), lane], [DOOR.cx + rand(-0.15, 0.15), ENTRY_OUT[1]], [DOOR.cx + rand(-0.2, 0.2), ENTRY_IN[1]]], speed: opt.speed || rand(1.35, 1.8),
    phase: Math.random() * 6, moving: true, dir: [fromLeft ? 1 : -1, 0], alpha: 0, umbrella: G.rain > 0.3 ? 1 : 0,
    timer: 0, patience: 0, mood: 0, bubble: null, bubbleT: 0, exitX: Math.random() < 0.5 ? 0.05 : BOARD.w - 0.05,
    ...opt.flags,
  };
  G.customers.push(c);
  return c;
}

function spawnPasser() {

function spawnCar() {
